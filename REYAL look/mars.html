<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Mars - Three.js</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script>

    // =====================================================
    // SCENE
    // =====================================================

    const container =
        document.getElementById("canvas-container");

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);


    // =====================================================
    // CAMERA
    // =====================================================

    const camera =
        new THREE.PerspectiveCamera(
            42,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

    camera.position.set(
        0,
        0,
        3.15
    );


    // =====================================================
    // RENDERER
    // =====================================================

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.15;

    container.appendChild(
        renderer.domElement
    );


    // =====================================================
    // ORBIT CONTROLS
    // =====================================================

    const controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping =
        true;

    controls.dampingFactor =
        0.04;

    controls.enablePan =
        false;

    controls.minDistance =
        1.45;

    controls.maxDistance =
        7;

    controls.autoRotate =
        true;

    controls.autoRotateSpeed =
        0.15;


    // =====================================================
    // TEXTURES
    // =====================================================

    const loader =
        new THREE.TextureLoader();


    /*
        Mars surface texture.

        This is the classic Mars global color map
        used in many Three.js planetary examples.
    */

    const marsColor =
        loader.load(
            "https://raw.githubusercontent.com/josdirksen/learning-threejs/master/assets/textures/planets/Mars_2k-050104.png"
        );


    /*
        Mars terrain normal map.
    */

    const marsNormal =
        loader.load(
            "https://raw.githubusercontent.com/josdirksen/learning-threejs/master/assets/textures/planets/Mars-normalmap_2k.png"
        );


    marsColor.encoding =
        THREE.sRGBEncoding;

    marsNormal.encoding =
        THREE.LinearEncoding;


    marsColor.anisotropy =
        renderer.capabilities.getMaxAnisotropy();

    marsNormal.anisotropy =
        renderer.capabilities.getMaxAnisotropy();


    // =====================================================
    // MARS
    // =====================================================

    const marsGeometry =
        new THREE.SphereGeometry(
            1,
            192,
            192
        );


    const marsMaterial =
        new THREE.MeshPhongMaterial({

            map:
                marsColor,

            normalMap:
                marsNormal,

            normalScale:
                new THREE.Vector2(
                    1.25,
                    1.25
                ),

            color:
                new THREE.Color(
                    0xffffff
                ),

            specular:
                new THREE.Color(
                    0x24110a
                ),

            shininess:
                5

        });


    const mars =
        new THREE.Mesh(
            marsGeometry,
            marsMaterial
        );

    scene.add(
        mars
    );


    // =====================================================
    // MARS ROTATION / TILT
    // =====================================================

    mars.rotation.z =
        THREE.MathUtils.degToRad(
            25.19
        );


    // =====================================================
    // ATMOSPHERE
    // =====================================================

    const atmosphereGeometry =
        new THREE.SphereGeometry(
            1.018,
            128,
            128
        );


    const atmosphereMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xd95b32,

            transparent:
                true,

            opacity:
                0.075,

            side:
                THREE.BackSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const atmosphere =
        new THREE.Mesh(
            atmosphereGeometry,
            atmosphereMaterial
        );

    scene.add(
        atmosphere
    );


    // =====================================================
    // OUTER SUBTLE GLOW
    // =====================================================

    const glowGeometry =
        new THREE.SphereGeometry(
            1.045,
            128,
            128
        );


    const glowMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xb83d22,

            transparent:
                true,

            opacity:
                0.025,

            side:
                THREE.BackSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const glow =
        new THREE.Mesh(
            glowGeometry,
            glowMaterial
        );

    scene.add(
        glow
    );


    // =====================================================
    // LIGHTING
    // =====================================================

    /*
        Main sunlight.
        Positioned upper-right just like the reference.
    */

    const sunlight =
        new THREE.DirectionalLight(
            0xffe4c7,
            2.8
        );

    sunlight.position.set(
        5,
        2.5,
        5
    );

    scene.add(
        sunlight
    );


    /*
        Very subtle fill light.
    */

    const fillLight =
        new THREE.DirectionalLight(
            0x6f2a18,
            0.18
        );

    fillLight.position.set(
        -4,
        -1,
        -4
    );

    scene.add(
        fillLight
    );


    /*
        Very weak ambient light.
        Keeps the dark side visible.
    */

    const ambientLight =
        new THREE.AmbientLight(
            0x35160e,
            0.16
        );

    scene.add(
        ambientLight
    );


    // =====================================================
    // STAR FIELD
    // =====================================================

    const starsGeometry =
        new THREE.BufferGeometry();

    const starCount =
        3500;

    const positions =
        new Float32Array(
            starCount * 3
        );


    for (
        let i = 0;
        i < starCount;
        i++
    ) {

        const radius =
            35 +
            Math.random() * 100;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                THREE.MathUtils.randFloat(
                    -1,
                    1
                )
            );


        positions[i * 3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        positions[i * 3 + 1] =
            radius *
            Math.cos(phi);

        positions[i * 3 + 2] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);
    }


    starsGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const starsMaterial =
        new THREE.PointsMaterial({

            color:
                0xffffff,

            size:
                0.035,

            transparent:
                true,

            opacity:
                0.75,

            depthWrite:
                false

        });


    const stars =
        new THREE.Points(
            starsGeometry,
            starsMaterial
        );

    scene.add(
        stars
    );


    // =====================================================
    // ANIMATION
    // =====================================================

    function animate() {

        requestAnimationFrame(
            animate
        );


        /*
            Very slow realistic rotation.
        */

        mars.rotation.y +=
            0.00045;


        controls.update();

        renderer.render(
            scene,
            camera
        );
    }


    animate();


    // =====================================================
    // RESIZE
    // =====================================================

    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>
</html>

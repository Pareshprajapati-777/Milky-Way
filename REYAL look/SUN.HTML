from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REALISTIC SUN — Three.js</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block}
#loading{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:#ffbd63;
    font:12px Arial,sans-serif;
    letter-spacing:5px;
    pointer-events:none;
    z-index:10;
}
</style>
</head>

<body>
<div id="loading">LOADING SOLAR SURFACE</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ============================================================
   REALISTIC SUN
   - Uses the supplied 2K solar texture as the photographic base
   - Preserves the reference texture's dark sunspots
   - Adds extra umbra/penumbra groups
   - Adds fine granulation without repainting the texture
   - Adds subtle limb darkening
   - Adds a physically-inspired hot corona
   ============================================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.01,
    1000
);
camera.position.set(0, 0.02, 3.05);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.035;
controls.enablePan = false;
controls.minDistance = 1.12;
controls.maxDistance = 7.0;
controls.target.set(0, 0, 0);

/* ============================================================
   TEXTURE
   ============================================================ */

const loader = new THREE.TextureLoader();
loader.crossOrigin = "anonymous";

const sunTexture = loader.load(
    "https://raw.githubusercontent.com/Shriisoot/Planets-texture/refs/heads/main/2k_sun.jpg",
    () => {
        const el = document.getElementById("loading");
        if (el) el.remove();
    }
);

sunTexture.encoding = THREE.sRGBEncoding;
sunTexture.wrapS = THREE.RepeatWrapping;
sunTexture.wrapT = THREE.ClampToEdgeWrapping;
sunTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

/* ============================================================
   SUN SHADERS
   ============================================================ */

const vertexShader = `
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vWorldPosition;

void main() {
    vUv = uv;

    vec4 worldPosition = modelMatrix * vec4(position, 1.0);

    vWorldPosition = worldPosition.xyz;
    vNormal = normalize(normalMatrix * normal);

    gl_Position =
        projectionMatrix *
        viewMatrix *
        worldPosition;
}
`;

const fragmentShader = `
uniform sampler2D uTexture;
uniform float uTime;

varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vWorldPosition;

/* ------------------------------------------------------------
   deterministic noise
   ------------------------------------------------------------ */

float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);

    f = f * f * (3.0 - 2.0 * f);

    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));

    return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}

float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;

    for (int i = 0; i < 5; i++) {
        v += noise(p) * a;
        p *= 2.02;
        a *= 0.5;
    }

    return v;
}

/* ------------------------------------------------------------
   organic sunspot
   ------------------------------------------------------------ */

float spot(vec2 uv, vec2 center, vec2 scale, float rotation) {
    vec2 p = uv - center;
    p.x -= round(p.x);

    float c = cos(rotation);
    float s = sin(rotation);

    p = vec2(
        p.x * c - p.y * s,
        p.x * s + p.y * c
    );

    p /= scale;

    float d = length(p);

    float irregular =
        fbm(uv * 90.0 + center * 17.0);

    float boundary =
        d + (irregular - 0.5) * 0.12;

    float pen =
        1.0 - smoothstep(0.62, 1.05, boundary);

    float umb =
        1.0 - smoothstep(0.18, 0.48, boundary);

    return umb * 0.95 + pen * 0.35;
}

/* ------------------------------------------------------------
   groups positioned to resemble the uploaded reference
   ------------------------------------------------------------ */

float sunspotGroups(vec2 uv) {
    float s = 0.0;

    /* left */
    s += spot(uv, vec2(0.105,0.425), vec2(0.018,0.026),  0.20);
    s += spot(uv, vec2(0.132,0.445), vec2(0.010,0.016), -0.30);
    s += spot(uv, vec2(0.153,0.418), vec2(0.006,0.010),  0.10);

    /* left-center */
    s += spot(uv, vec2(0.285,0.395), vec2(0.023,0.032), -0.15);
    s += spot(uv, vec2(0.315,0.415), vec2(0.011,0.018),  0.40);
    s += spot(uv, vec2(0.338,0.385), vec2(0.006,0.011), -0.25);

    /* central active region */
    s += spot(uv, vec2(0.482,0.485), vec2(0.032,0.045),  0.20);
    s += spot(uv, vec2(0.515,0.455), vec2(0.017,0.027), -0.25);
    s += spot(uv, vec2(0.548,0.475), vec2(0.011,0.018),  0.30);
    s += spot(uv, vec2(0.500,0.425), vec2(0.007,0.013), -0.10);

    /* major right active region */
    s += spot(uv, vec2(0.675,0.395), vec2(0.038,0.050), -0.25);
    s += spot(uv, vec2(0.712,0.415), vec2(0.019,0.029),  0.25);
    s += spot(uv, vec2(0.742,0.385), vec2(0.012,0.019), -0.20);
    s += spot(uv, vec2(0.695,0.447), vec2(0.009,0.014),  0.40);

    /* far right */
    s += spot(uv, vec2(0.872,0.365), vec2(0.020,0.029),  0.10);
    s += spot(uv, vec2(0.902,0.388), vec2(0.011,0.017), -0.20);
    s += spot(uv, vec2(0.928,0.350), vec2(0.006,0.010),  0.25);

    /* lower smaller spots */
    s += spot(uv, vec2(0.200,0.670), vec2(0.009,0.014),  0.10);
    s += spot(uv, vec2(0.355,0.720), vec2(0.006,0.010), -0.20);
    s += spot(uv, vec2(0.585,0.680), vec2(0.010,0.015),  0.30);
    s += spot(uv, vec2(0.805,0.650), vec2(0.008,0.012), -0.15);

    return clamp(s, 0.0, 1.0);
}

/* ------------------------------------------------------------
   small natural dark pore distribution
   ------------------------------------------------------------ */

float smallPores(vec2 uv) {
    vec2 grid = floor(uv * vec2(95.0, 48.0));
    float r = hash21(grid);

    float local = noise(uv * 95.0);

    float tiny =
        step(0.91, r) *
        smoothstep(0.42, 0.82, local);

    return tiny;
}

void main() {

    /* The sphere itself rotates in JavaScript.
       Do NOT scroll the texture, otherwise sunspots smear. */
    vec2 uv = vUv;

    vec3 base =
        texture2D(uTexture, uv).rgb;

    float luminance =
        dot(base, vec3(0.299, 0.587, 0.114));

    /* --------------------------------------------------------
       fine convection detail
       -------------------------------------------------------- */

    float n1 =
        fbm(
            uv * 70.0 +
            vec2(uTime * 0.025, -uTime * 0.012)
        );

    float n2 =
        fbm(
            uv * 150.0 -
            vec2(uTime * 0.018, uTime * 0.009)
        );

    float gran =
        mix(n1, n2, 0.32);

    /* Very small additive detail: preserve original texture */
    vec3 granularBoost =
        vec3(1.0, 0.30, 0.035) *
        (gran - 0.48) *
        0.18;

    base += granularBoost;

    /* --------------------------------------------------------
       preserve original dark texture
       -------------------------------------------------------- */

    float naturalDark =
        1.0 - smoothstep(0.10, 0.36, luminance);

    base *= mix(1.0, 0.62, naturalDark);

    /* --------------------------------------------------------
       procedural sunspots
       -------------------------------------------------------- */

    float spots =
        sunspotGroups(uv);

    float spotVariation =
        mix(
            0.82,
            1.18,
            noise(uv * 210.0)
        );

    spots =
        clamp(
            spots * spotVariation,
            0.0,
            1.0
        );

    /* Deep umbra */
    base =
        mix(
            base,
            base * vec3(0.035, 0.018, 0.004),
            smoothstep(0.30, 0.72, spots)
        );

    /* warm penumbra */
    float pen =
        smoothstep(0.05, 0.45, spots) *
        (1.0 - smoothstep(0.45, 0.90, spots));

    base +=
        vec3(0.16, 0.022, 0.002) *
        pen;

    /* tiny pores */
    float pores = smallPores(uv);

    base *=
        1.0 - pores * 0.16;

    /* --------------------------------------------------------
       limb darkening
       -------------------------------------------------------- */

    vec3 viewDir =
        normalize(
            cameraPosition -
            vWorldPosition
        );

    float facing =
        max(
            dot(
                normalize(vNormal),
                viewDir
            ),
            0.0
        );

    float limb =
        pow(facing, 0.48);

    base *=
        mix(
            0.57,
            1.0,
            limb
        );

    /* subtle hot limb */
    float edge =
        pow(1.0 - facing, 3.2);

    base +=
        vec3(1.0, 0.18, 0.008) *
        edge *
        0.075;

    /* restrained solar emission */
    base *= 1.28;

    /* avoid crushing dark sunspots */
    base =
        max(base, vec3(0.003, 0.001, 0.0002));

    gl_FragColor =
        vec4(base, 1.0);
}
`;

const sunMaterial = new THREE.ShaderMaterial({
    uniforms: {
        uTexture: { value: sunTexture },
        uTime: { value: 0 }
    },
    vertexShader,
    fragmentShader,
    side: THREE.FrontSide
});

/* ============================================================
   SUN
   ============================================================ */

const sunGeometry =
    new THREE.SphereGeometry(1, 384, 384);

const sun =
    new THREE.Mesh(
        sunGeometry,
        sunMaterial
    );

scene.add(sun);

/* ============================================================
   CORONA
   ============================================================ */

const coronaVertex = `
varying vec3 vNormal;
varying vec3 vWorldPosition;

void main() {
    vec4 world =
        modelMatrix *
        vec4(position, 1.0);

    vWorldPosition = world.xyz;

    vNormal =
        normalize(
            normalMatrix * normal
        );

    gl_Position =
        projectionMatrix *
        viewMatrix *
        world;
}
`;

const coronaFragment = `
uniform float uTime;
uniform float uAlpha;
uniform vec3 uColor;

varying vec3 vNormal;
varying vec3 vWorldPosition;

float hash(float n) {
    return fract(sin(n) * 43758.5453);
}

void main() {

    vec3 viewDir =
        normalize(
            cameraPosition -
            vWorldPosition
        );

    float facing =
        abs(
            dot(
                normalize(vNormal),
                viewDir
            )
        );

    float rim =
        pow(
            1.0 - facing,
            3.0
        );

    float a =
        atan(
            vNormal.y,
            vNormal.x
        );

    float stream =
        0.72 +
        0.28 *
        sin(
            a * 18.0 +
            uTime * 0.10
        );

    float alpha =
        rim *
        stream *
        uAlpha;

    gl_FragColor =
        vec4(
            uColor,
            alpha
        );
}
`;

function makeCorona(radius, alpha) {

    const material =
        new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uAlpha: { value: alpha },
                uColor: {
                    value:
                        new THREE.Color(
                            0xff6a12
                        )
                }
            },
            vertexShader: coronaVertex,
            fragmentShader: coronaFragment,
            transparent: true,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

    const mesh =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                radius,
                128,
                128
            ),
            material
        );

    scene.add(mesh);
    return mesh;
}

const corona1 = makeCorona(1.035, 0.38);
const corona2 = makeCorona(1.075, 0.20);
const corona3 = makeCorona(1.145, 0.075);

/* ============================================================
   PROMINENCE / CORONA PARTICLES
   ============================================================ */

const particleCount = 2600;
const particlePositions =
    new Float32Array(
        particleCount * 3
    );

for (let i = 0; i < particleCount; i++) {

    const theta =
        Math.random() * Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    const r =
        1.008 +
        Math.pow(Math.random(), 1.7) * 0.16;

    particlePositions[i * 3] =
        r * Math.sin(phi) * Math.cos(theta);

    particlePositions[i * 3 + 1] =
        r * Math.sin(phi) * Math.sin(theta);

    particlePositions[i * 3 + 2] =
        r * Math.cos(phi);
}

const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({
        color: 0xff8b1a,
        size: 0.009,
        transparent: true,
        opacity: 0.20,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);

/* ============================================================
   STARS
   ============================================================ */

const starCount = 6500;

const starPositions =
    new Float32Array(
        starCount * 3
    );

for (let i = 0; i < starCount; i++) {

    const r =
        35 + Math.random() * 90;

    const theta =
        Math.random() * Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    starPositions[i * 3] =
        r * Math.sin(phi) * Math.cos(theta);

    starPositions[i * 3 + 1] =
        r * Math.sin(phi) * Math.sin(theta);

    starPositions[i * 3 + 2] =
        r * Math.cos(phi);
}

const starGeometry =
    new THREE.BufferGeometry();

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.035,
        transparent: true,
        opacity: 0.62,
        sizeAttenuation: true
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);

/* ============================================================
   ANIMATION
   ============================================================ */

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const t =
        clock.getElapsedTime();

    /* Real texture rotates with the sphere.
       It is NOT scrolled in UV space. */
    sun.rotation.y += 0.00042;

    sunMaterial.uniforms.uTime.value = t;

    corona1.material.uniforms.uTime.value = t;
    corona2.material.uniforms.uTime.value = t * 0.72;
    corona3.material.uniforms.uTime.value = t * 0.45;

    corona1.rotation.y += 0.00014;
    corona2.rotation.y -= 0.00009;
    corona3.rotation.y += 0.000055;

    particles.rotation.y += 0.00018;
    particles.rotation.z += 0.000018;

    stars.rotation.y += 0.000003;

    controls.update();

    renderer.render(scene, camera);
}

animate();

/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>
</body>
</html>
'''

path = Path("/mnt/data/realistic_sun_final.html")
path.write_text(html, encoding="utf-8")
print(path)

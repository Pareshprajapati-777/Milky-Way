<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper-Realistic 8K Moon — Three.js</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
    }

    #canvas-container {
        width: 100vw;
        height: 100vh;
        position: relative;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle at 50% 45%, rgba(35,35,35,.22), rgba(0,0,0,.98) 55%);
        color: #ddd;
        z-index: 20;
        letter-spacing: 3px;
        font-size: 12px;
        transition: opacity .5s ease;
        pointer-events: none;
    }

    #loading.hidden {
        opacity: 0;
    }

    #credit {
        position: fixed;
        left: 16px;
        bottom: 14px;
        z-index: 10;
        color: rgba(255,255,255,.42);
        font-size: 10px;
        letter-spacing: 1px;
        pointer-events: none;
        text-transform: uppercase;
    }
</style>
</head>

<body>
<div id="canvas-container"></div>
<div id="loading">LOADING 8K LUNAR SURFACE</div>
<div id="credit">Moon texture: Solar System Scope / NASA LOLA / Wikimedia Commons · CC BY 4.0</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
"use strict";

/*
    ============================================================
    HYPER-REALISTIC MOON
    Built from high-resolution lunar photography and topographic maps:
      - 8K equirectangular lunar albedo
      - lunar elevation bump
      - very high sphere resolution
      - physically softer lighting
      - subtle rim illumination
      - slow automatic rotation
      - OrbitControls for inspection
    ============================================================
*/

const container = document.getElementById("canvas-container");
const loading = document.getElementById("loading");

/* ------------------------------------------------------------
   SCENE
------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

/* ------------------------------------------------------------
   CAMERA
------------------------------------------------------------ */
const camera = new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.01,
    100
);

camera.position.set(0, 0.03, 3.05);

/* ------------------------------------------------------------
   RENDERER
------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

container.appendChild(renderer.domElement);

/* ------------------------------------------------------------
   CONTROLS
------------------------------------------------------------ */
const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.045;

controls.enablePan = false;
controls.minDistance = 1.55;
controls.maxDistance = 7.0;

controls.autoRotate = true;
controls.autoRotateSpeed = 0.10;

/* ------------------------------------------------------------
   LIGHTING
------------------------------------------------------------ */

/* Main Sun-like source */
const sun = new THREE.DirectionalLight(
    0xffffff,
    2.55
);

sun.position.set(4.5, 2.2, 5.5);
sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);

/* Very weak cool fill so the unlit hemisphere is not crushed */
const fill = new THREE.DirectionalLight(
    0xaeb8c4,
    0.16
);

fill.position.set(-4, -1.5, -4);
scene.add(fill);

/* Soft global illumination */
const ambient = new THREE.AmbientLight(
    0x8d9298,
    0.13
);

scene.add(ambient);

/* Very subtle top light */
const hemi = new THREE.HemisphereLight(
    0xdde3ea,
    0x161719,
    0.16
);

scene.add(hemi);

/* ------------------------------------------------------------
   TEXTURES
------------------------------------------------------------ */

const loader = new THREE.TextureLoader();
loader.crossOrigin = "anonymous";

/*
   8192 × 4096 equirectangular lunar surface.
   Primary: High-resolution GitHub raw mirror with instant 2K fallback.
*/
const MOON_COLOR_URL =
    "https://raw.githubusercontent.com/smithcg1/DigitalSolarSystem/master/8k_moon.jpg";
const MOON_COLOR_FALLBACK =
    "https://raw.githubusercontent.com/Shriisoot/Planets-texture/refs/heads/main/2k_moon.jpg";

/*
   Elevation map used as a bump source to make craters and terrain react to light.
*/
const MOON_HEIGHT_URL =
    "https://raw.githubusercontent.com/jeromeetienne/threex.planets/master/images/moonbump1k.jpg";

/* ------------------------------------------------------------
   MOON GEOMETRY
------------------------------------------------------------ */

const geometry = new THREE.SphereGeometry(
    1,
    256,
    256
);

/*
   Small physical-scale displacement gives large crater rims
   a little real silhouette variation without making the Moon
   look like a rock with exaggerated spikes.
*/
const material = new THREE.MeshStandardMaterial({
    color: 0xffffff,

    roughness: 0.94,
    metalness: 0.0,

    bumpScale: 0.052,

    displacementScale: 0.018,
    displacementBias: -0.009,

    envMapIntensity: 0.05
});

const moon = new THREE.Mesh(
    geometry,
    material
);

moon.castShadow = true;
moon.receiveShadow = true;

/*
   Match the visual orientation of the full-Moon reference.
*/
moon.rotation.z = THREE.MathUtils.degToRad(5);

scene.add(moon);

/* ------------------------------------------------------------
   LOAD COLOR MAP
------------------------------------------------------------ */

function applyColorTexture(tex) {
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    material.map = tex;
    material.color.set(0xffffff);
    material.needsUpdate = true;
    hideLoading();
}

loader.load(
    MOON_COLOR_URL,
    function(texture) {
        applyColorTexture(texture);
    },
    undefined,
    function(error) {
        console.warn("8K Moon primary texture failed, trying fast 2K fallback:", error);
        loader.load(
            MOON_COLOR_FALLBACK,
            function(fallbackTex) {
                applyColorTexture(fallbackTex);
            },
            undefined,
            function(err2) {
                console.error("All Moon color textures failed:", err2);
                material.color.set(0x999999);
                material.needsUpdate = true;
                hideLoading();
            }
        );
    }
);

/* ------------------------------------------------------------
   LOAD LUNAR ELEVATION / BUMP MAP
------------------------------------------------------------ */

loader.load(
    MOON_HEIGHT_URL,
    function(texture) {
        texture.encoding = THREE.LinearEncoding;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;

        material.bumpMap = texture;
        material.displacementMap = texture;
        material.needsUpdate = true;
    },
    undefined,
    function(error) {
        console.warn("Lunar elevation map unavailable:", error);
    }
);

/* ------------------------------------------------------------
   SUBTLE ATMOSPHERE / EDGE HALO
   The Moon has no Earth-like atmosphere, so this is deliberately
   tiny and only used to reproduce the photographic edge softness
   visible in photographic references.
------------------------------------------------------------ */

const haloGeometry = new THREE.SphereGeometry(
    1.018,
    128,
    128
);

const haloMaterial = new THREE.MeshBasicMaterial({
    color: 0xbfc4ca,
    transparent: true,
    opacity: 0.018,
    side: THREE.BackSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});

const halo = new THREE.Mesh(
    haloGeometry,
    haloMaterial
);

scene.add(halo);

/* ------------------------------------------------------------
   STARS
------------------------------------------------------------ */

const starGeometry = new THREE.BufferGeometry();

const starCount = 6000;
const starPositions = new Float32Array(starCount * 3);
const starSizes = new Float32Array(starCount);

for (let i = 0; i < starCount; i++) {
    const radius = 35 + Math.random() * 110;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(THREE.MathUtils.randFloat(-1, 1));
    const i3 = i * 3;

    starPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
    starPositions[i3 + 1] = radius * Math.cos(phi);
    starPositions[i3 + 2] = radius * Math.sin(phi) * Math.sin(theta);

    starSizes[i] = 0.018 + Math.random() * 0.028;
}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(starPositions, 3)
);

starGeometry.setAttribute(
    "size",
    new THREE.BufferAttribute(starSizes, 1)
);

const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.026,
    transparent: true,
    opacity: 0.78,
    depthWrite: false,
    sizeAttenuation: true
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);

/* ------------------------------------------------------------
   MICRO DETAIL LAYER
   A very subtle second shell gives the surface a little more
   visual breakup at medium distance without visibly duplicating
   the Moon.
------------------------------------------------------------ */

const detailGeometry = new THREE.SphereGeometry(
    1.003,
    192,
    192
);

const detailMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.025,
    depthWrite: false,
    blending: THREE.MultiplyBlending
});

const detailLayer = new THREE.Mesh(
    detailGeometry,
    detailMaterial
);

scene.add(detailLayer);

/* ------------------------------------------------------------
   LOADING
------------------------------------------------------------ */

function hideLoading() {
    loading.classList.add("hidden");
    setTimeout(function() {
        loading.style.display = "none";
    }, 700);
}

/* ------------------------------------------------------------
   ANIMATION
------------------------------------------------------------ */

function animate() {
    requestAnimationFrame(animate);

    /*
       Extremely slow physical-looking rotation.
       OrbitControls adds the smooth inspection movement.
    */
    moon.rotation.y += 0.00032;

    halo.rotation.copy(moon.rotation);
    detailLayer.rotation.copy(moon.rotation);

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

/* ------------------------------------------------------------
   RESIZE
------------------------------------------------------------ */

window.addEventListener(
    "resize",
    function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }
);
</script>

</body>
</html>

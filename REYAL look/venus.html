<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Realistic Venus - Three.js</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

    // =====================================================
    // SCENE
    // =====================================================

    const container =
        document.getElementById("canvas-container");

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);


    // =====================================================
    // CAMERA
    // =====================================================

    const camera =
        new THREE.PerspectiveCamera(
            42,
            window.innerWidth /
            window.innerHeight,
            0.1,
            100
        );

    camera.position.set(
        0,
        0,
        3.05
    );


    // =====================================================
    // RENDERER
    // =====================================================

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.15;

    container.appendChild(
        renderer.domElement
    );


    // =====================================================
    // ORBIT CONTROLS
    // =====================================================

    const controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping =
        true;

    controls.dampingFactor =
        0.04;

    controls.enablePan =
        false;

    controls.minDistance =
        1.4;

    controls.maxDistance =
        7;

    controls.autoRotate =
        true;

    controls.autoRotateSpeed =
        0.12;


    // =====================================================
    // LIGHTING
    // =====================================================

    const sunLight =
        new THREE.DirectionalLight(
            0xffe7b8,
            3.2
        );

    sunLight.position.set(
        4.5,
        2.5,
        5
    );

    scene.add(
        sunLight
    );


    const fillLight =
        new THREE.DirectionalLight(
            0x8f542c,
            0.28
        );

    fillLight.position.set(
        -4,
        -1,
        -4
    );

    scene.add(
        fillLight
    );


    const ambientLight =
        new THREE.AmbientLight(
            0x553016,
            0.35
        );

    scene.add(
        ambientLight
    );


    // =====================================================
    // TEXTURE LOADER
    // =====================================================

    const loader =
        new THREE.TextureLoader();

    loader.crossOrigin =
        "anonymous";


    // =====================================================
    // NASA VENUS SURFACE TEXTURE
    // =====================================================

    /*
       NASA/JPL Venus global map.

       Magellan radar imagery.
       1440 x 720 global map.
    */

    const venusTexture =
        loader.load(
            "https://raw.githubusercontent.com/smithcg1/DigitalSolarSystem/master/8k_venus_surface.jpg",

            function(texture) {

                texture.encoding =
                    THREE.sRGBEncoding;

                texture.anisotropy =
                    renderer.capabilities
                        .getMaxAnisotropy();

                venus.material.map =
                    texture;

                venus.material.needsUpdate =
                    true;

                console.log(
                    "Venus texture loaded"
                );
            },

            undefined,

            function(error) {

                console.error(
                    "Venus texture failed",
                    error
                );

                // fallback
                venus.material.color.set(
                    0xd89b55
                );

                venus.material.needsUpdate =
                    true;
            }
        );


    // =====================================================
    // VENUS GEOMETRY
    // =====================================================

    const venusGeometry =
        new THREE.SphereGeometry(
            1,
            192,
            192
        );


    // =====================================================
    // VENUS MATERIAL
    // =====================================================

    const venusMaterial =
        new THREE.MeshPhongMaterial({

            color:
                new THREE.Color(
                    0xffffff
                ),

            map:
                venusTexture,

            specular:
                new THREE.Color(
                    0x26170c
                ),

            shininess:
                5

        });


    // =====================================================
    // VENUS
    // =====================================================

    const venus =
        new THREE.Mesh(
            venusGeometry,
            venusMaterial
        );

    scene.add(
        venus
    );


    // =====================================================
    // VENUS ROTATION
    // =====================================================

    venus.rotation.z =
        THREE.MathUtils.degToRad(
            3
        );


    // =====================================================
    // ATMOSPHERE
    // =====================================================

    /*
       Venus has a very thick atmosphere.
       This layer gives the planet a warm edge.
    */

    const atmosphereGeometry =
        new THREE.SphereGeometry(
            1.025,
            128,
            128
        );


    const atmosphereMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xffc66d,

            transparent:
                true,

            opacity:
                0.09,

            side:
                THREE.BackSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const atmosphere =
        new THREE.Mesh(
            atmosphereGeometry,
            atmosphereMaterial
        );

    scene.add(
        atmosphere
    );


    // =====================================================
    // SECOND ATMOSPHERE
    // =====================================================

    const atmosphere2Geometry =
        new THREE.SphereGeometry(
            1.055,
            128,
            128
        );


    const atmosphere2Material =
        new THREE.MeshBasicMaterial({

            color:
                0xffa94f,

            transparent:
                true,

            opacity:
                0.035,

            side:
                THREE.BackSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const atmosphere2 =
        new THREE.Mesh(
            atmosphere2Geometry,
            atmosphere2Material
        );

    scene.add(
        atmosphere2
    );


    // =====================================================
    // STARS
    // =====================================================

    const starsGeometry =
        new THREE.BufferGeometry();

    const starCount =
        4000;

    const starPositions =
        new Float32Array(
            starCount * 3
        );


    for (
        let i = 0;
        i < starCount;
        i++
    ) {

        const radius =
            35 +
            Math.random() * 100;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                THREE.MathUtils.randFloat(
                    -1,
                    1
                )
            );


        starPositions[
            i * 3
        ] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);


        starPositions[
            i * 3 + 1
        ] =
            radius *
            Math.cos(phi);


        starPositions[
            i * 3 + 2
        ] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);

    }


    starsGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            starPositions,
            3
        )
    );


    const starsMaterial =
        new THREE.PointsMaterial({

            color:
                0xffffff,

            size:
                0.035,

            transparent:
                true,

            opacity:
                0.8,

            depthWrite:
                false

        });


    const stars =
        new THREE.Points(
            starsGeometry,
            starsMaterial
        );

    scene.add(
        stars
    );


    // =====================================================
    // ANIMATION
    // =====================================================

    function animate() {

        requestAnimationFrame(
            animate
        );


        // Slow Venus rotation

        venus.rotation.y +=
            0.00028;


        controls.update();


        renderer.render(
            scene,
            camera
        );

    }


    animate();


    // =====================================================
    // RESIZE
    // =====================================================

    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Realistic Saturn 8K</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
    }

    #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        background: #000;
        font-family: Arial;
        font-size: 18px;
        z-index: 10;
    }
</style>
</head>

<body>

<div id="loading">Loading Saturn 8K...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);

////////////////////////////////////////////////////////////
// CAMERA
////////////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    1000
);

camera.position.set(0, 1.5, 4.8);

////////////////////////////////////////////////////////////
// RENDERER
////////////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputEncoding = THREE.sRGBEncoding;

renderer.physicallyCorrectLights = true;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////////////
// CONTROLS
////////////////////////////////////////////////////////////

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.035;

controls.enablePan = false;

controls.minDistance = 2.5;
controls.maxDistance = 12;

controls.target.set(0, 0, 0);

////////////////////////////////////////////////////////////
// TEXTURE LOADER
////////////////////////////////////////////////////////////

const loader = new THREE.TextureLoader();

////////////////////////////////////////////////////////////
// SATURN 8K TEXTURE
////////////////////////////////////////////////////////////

const saturnTexture = loader.load(
    "https://raw.githubusercontent.com/Shriisoot/Planets-texture/main/8k_saturn.jpg",

    function(texture) {

        texture.encoding = THREE.sRGBEncoding;

        texture.anisotropy =
            renderer.capabilities.getMaxAnisotropy();

        texture.generateMipmaps = true;

        texture.minFilter =
            THREE.LinearMipmapLinearFilter;

        texture.magFilter =
            THREE.LinearFilter;

        texture.needsUpdate = true;

        document.getElementById("loading").style.display = "none";
    },

    undefined,

    function(error) {

        console.error(
            "Saturn texture failed:",
            error
        );

        document.getElementById("loading").innerHTML =
            "Saturn texture failed to load";
    }
);

////////////////////////////////////////////////////////////
// SATURN BODY
////////////////////////////////////////////////////////////

const saturnGeometry =
    new THREE.SphereGeometry(
        1,
        256,
        256
    );

const saturnMaterial =
    new THREE.MeshPhongMaterial({

        map: saturnTexture,

        color: 0xffffff,

        shininess: 3,

        specular: new THREE.Color(
            0x15100a
        ),

        bumpScale: 0.025
    });

const saturn =
    new THREE.Mesh(
        saturnGeometry,
        saturnMaterial
    );

////////////////////////////////////////////////////////////
// REAL SATURN SHAPE
////////////////////////////////////////////////////////////

saturn.scale.set(
    1,
    0.904,
    1
);

////////////////////////////////////////////////////////////
// SATURN AXIAL TILT
////////////////////////////////////////////////////////////

saturn.rotation.z =
    THREE.MathUtils.degToRad(26.73);

scene.add(saturn);

////////////////////////////////////////////////////////////
// ATMOSPHERE
////////////////////////////////////////////////////////////

const atmosphereGeometry =
    new THREE.SphereGeometry(
        1.018,
        128,
        128
    );

const atmosphereMaterial =
    new THREE.ShaderMaterial({

        transparent: true,

        side: THREE.BackSide,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false,

        uniforms: {

            glowColor: {
                value: new THREE.Color(
                    0xd8b979
                )
            }

        },

        vertexShader: `

            varying vec3 vNormal;
            varying vec3 vWorldPosition;

            void main() {

                vNormal =
                    normalize(
                        normalMatrix * normal
                    );

                vec4 worldPosition =
                    modelMatrix *
                    vec4(position,1.0);

                vWorldPosition =
                    worldPosition.xyz;

                gl_Position =
                    projectionMatrix *
                    viewMatrix *
                    worldPosition;
            }

        `,

        fragmentShader: `

            uniform vec3 glowColor;

            varying vec3 vNormal;
            varying vec3 vWorldPosition;

            void main() {

                vec3 viewDirection =
                    normalize(
                        cameraPosition -
                        vWorldPosition
                    );

                float rim =
                    1.0 -
                    max(
                        dot(vNormal, viewDirection),
                        0.0
                    );

                rim =
                    pow(rim, 3.2);

                float alpha =
                    rim * 0.28;

                gl_FragColor =
                    vec4(
                        glowColor,
                        alpha
                    );
            }

        `
    });

const atmosphere =
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    );

atmosphere.scale.set(
    1,
    0.904,
    1
);

atmosphere.rotation.z =
    THREE.MathUtils.degToRad(26.73);

scene.add(atmosphere);

////////////////////////////////////////////////////////////
// SATURN RINGS TEXTURE
////////////////////////////////////////////////////////////

const ringTexture =
    loader.load(
        "https://raw.githubusercontent.com/Shriisoot/Planets-texture/main/8k_saturn_ring_alpha.png"
    );

ringTexture.wrapS =
    THREE.ClampToEdgeWrapping;

ringTexture.wrapT =
    THREE.ClampToEdgeWrapping;

ringTexture.anisotropy =
    renderer.capabilities.getMaxAnisotropy();

////////////////////////////////////////////////////////////
// MAIN RING SYSTEM
////////////////////////////////////////////////////////////

function createRing(
    inner,
    outer,
    opacity,
    rotation = 0
) {

    const geometry =
        new THREE.RingGeometry(
            inner,
            outer,
            512,
            64
        );

    const material =
        new THREE.MeshPhongMaterial({

            map: ringTexture,

            alphaMap: ringTexture,

            transparent: true,

            opacity: opacity,

            side: THREE.DoubleSide,

            depthWrite: false,

            color: 0xd8c59a,

            shininess: 4
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.x =
        Math.PI / 2;

    ring.rotation.z =
        rotation;

    ring.scale.y = 0.905;

    return ring;
}

////////////////////////////////////////////////////////////
// INNER RING
////////////////////////////////////////////////////////////

const innerRing =
    createRing(
        1.23,
        1.38,
        0.85
    );

scene.add(innerRing);

////////////////////////////////////////////////////////////
// C RING
////////////////////////////////////////////////////////////

const cRing =
    createRing(
        1.38,
        1.55,
        0.75
    );

scene.add(cRing);

////////////////////////////////////////////////////////////
// B RING
////////////////////////////////////////////////////////////

const bRing =
    createRing(
        1.55,
        1.82,
        0.95
    );

scene.add(bRing);

////////////////////////////////////////////////////////////
// CASSINI DIVISION
////////////////////////////////////////////////////////////

const cassini =
    createRing(
        1.82,
        1.91,
        0.04
    );

scene.add(cassini);

////////////////////////////////////////////////////////////
// A RING
////////////////////////////////////////////////////////////

const aRing =
    createRing(
        1.91,
        2.15,
        0.9
    );

scene.add(aRing);

////////////////////////////////////////////////////////////
// F RING
////////////////////////////////////////////////////////////

const fRing =
    createRing(
        2.18,
        2.22,
        0.65
    );

scene.add(fRing);

////////////////////////////////////////////////////////////
// RING PARTICLE DETAIL
////////////////////////////////////////////////////////////

const particleCount = 18000;

const positions =
    new Float32Array(
        particleCount * 3
    );

const colors =
    new Float32Array(
        particleCount * 3
    );

for (
    let i = 0;
    i < particleCount;
    i++
) {

    const angle =
        Math.random() *
        Math.PI *
        2;

    const radius =
        1.30 +
        Math.random() *
        0.90;

    const x =
        Math.cos(angle) *
        radius;

    const z =
        Math.sin(angle) *
        radius;

    const y =
        (Math.random() - 0.5)
        * 0.006;

    positions[i * 3] =
        x;

    positions[i * 3 + 1] =
        y;

    positions[i * 3 + 2] =
        z;

    const brightness =
        0.55 +
        Math.random() *
        0.45;

    colors[i * 3] =
        brightness;

    colors[i * 3 + 1] =
        brightness * 0.92;

    colors[i * 3 + 2] =
        brightness * 0.70;
}

const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);

particleGeometry.setAttribute(
    "color",
    new THREE.BufferAttribute(
        colors,
        3
    )
);

const particleMaterial =
    new THREE.PointsMaterial({

        size: 0.008,

        vertexColors: true,

        transparent: true,

        opacity: 0.55,

        depthWrite: false
    });

const ringParticles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

ringParticles.rotation.x =
    Math.PI / 2;

ringParticles.rotation.z =
    THREE.MathUtils.degToRad(26.73);

scene.add(ringParticles);

////////////////////////////////////////////////////////////
// STARS
////////////////////////////////////////////////////////////

const starCount = 9000;

const starPositions =
    new Float32Array(
        starCount * 3
    );

for (
    let i = 0;
    i < starCount;
    i++
) {

    const radius =
        30 +
        Math.random() * 150;

    const theta =
        Math.random() *
        Math.PI *
        2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    starPositions[i * 3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    starPositions[i * 3 + 1] =
        radius *
        Math.cos(phi);

    starPositions[i * 3 + 2] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);
}

const starGeometry =
    new THREE.BufferGeometry();

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.035,

        transparent: true,

        opacity: 0.85,

        depthWrite: false
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);

////////////////////////////////////////////////////////////
// LIGHTING
////////////////////////////////////////////////////////////

// MAIN SUN LIGHT

const sunLight =
    new THREE.DirectionalLight(
        0xfff1d0,
        4.0
    );

sunLight.position.set(
    -6,
    3,
    5
);

scene.add(sunLight);

////////////////////////////////////////////////////////////
// WARM FILL LIGHT
////////////////////////////////////////////////////////////

const fillLight =
    new THREE.PointLight(
        0xc9a96b,
        1.2,
        20
    );

fillLight.position.set(
    4,
    2,
    4
);

scene.add(fillLight);

////////////////////////////////////////////////////////////
// VERY LOW AMBIENT
////////////////////////////////////////////////////////////

const ambient =
    new THREE.AmbientLight(
        0x554936,
        0.22
    );

scene.add(ambient);

////////////////////////////////////////////////////////////
// RING GROUP
////////////////////////////////////////////////////////////

const ringGroup =
    new THREE.Group();

ringGroup.add(
    innerRing,
    cRing,
    bRing,
    cassini,
    aRing,
    fRing,
    ringParticles
);

ringGroup.rotation.z =
    THREE.MathUtils.degToRad(26.73);

scene.add(ringGroup);

////////////////////////////////////////////////////////////
// ANIMATION
////////////////////////////////////////////////////////////

function animate() {

    requestAnimationFrame(
        animate
    );

    ////////////////////////////////////////////////////////
    // SATURN ROTATION
    ////////////////////////////////////////////////////////

    saturn.rotation.y +=
        0.00055;

    ////////////////////////////////////////////////////////
    // ATMOSPHERE ROTATION
    ////////////////////////////////////////////////////////

    atmosphere.rotation.y =
        saturn.rotation.y;

    ////////////////////////////////////////////////////////
    // RINGS
    ////////////////////////////////////////////////////////

    ringGroup.rotation.y +=
        0.00010;

    ////////////////////////////////////////////////////////
    // STARS
    ////////////////////////////////////////////////////////

    stars.rotation.y +=
        0.000015;

    ////////////////////////////////////////////////////////
    // CONTROLS
    ////////////////////////////////////////////////////////

    controls.update();

    ////////////////////////////////////////////////////////
    // RENDER
    ////////////////////////////////////////////////////////

    renderer.render(
        scene,
        camera
    );
}

animate();

////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>

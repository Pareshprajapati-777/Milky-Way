<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jupiter 8K - Three.js</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="canvas-container"></div>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- ORBIT CONTROLS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

    // =========================================================
    // BASIC SETUP
    // =========================================================

    const container =
        document.getElementById("canvas-container");

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);


    // =========================================================
    // CAMERA
    // =========================================================

    const camera =
        new THREE.PerspectiveCamera(
            38,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );

    camera.position.set(
        0,
        0.05,
        3.15
    );


    // =========================================================
    // RENDERER
    // =========================================================

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.15;

    container.appendChild(
        renderer.domElement
    );


    // =========================================================
    // CONTROLS
    // =========================================================

    const controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping =
        true;

    controls.dampingFactor =
        0.035;

    controls.enablePan =
        false;

    controls.minDistance =
        1.55;

    controls.maxDistance =
        7;

    controls.autoRotate =
        true;

    controls.autoRotateSpeed =
        0.10;

    controls.enableZoom =
        true;


    // =========================================================
    // LIGHTING
    // =========================================================

    // Main sunlight
    const sun =
        new THREE.DirectionalLight(
            0xffead2,
            3.8
        );

    sun.position.set(
        4.5,
        2.2,
        5.0
    );

    scene.add(sun);


    // Soft reflected light
    const fill =
        new THREE.DirectionalLight(
            0xa16e4c,
            0.30
        );

    fill.position.set(
        -4,
        -1.5,
        -4
    );

    scene.add(fill);


    // Very soft ambient
    const ambient =
        new THREE.AmbientLight(
            0x5c4434,
            0.32
        );

    scene.add(ambient);


    // =========================================================
    // TEXTURE LOADER
    // =========================================================

    const loader =
        new THREE.TextureLoader();

    loader.crossOrigin =
        "anonymous";


    // =========================================================
    // 8K JUPITER TEXTURE
    // =========================================================

    /*
        8192 x 4096 class Jupiter texture.

        This is the important part.
        Previous version used a small preview.

        Source repository contains:
        8k_jupiter.jpg
    */

    const JUPITER_8K =
        "https://raw.githubusercontent.com/smithcg1/DigitalSolarSystem/master/8k_jupiter.jpg";


    let textureLoaded =
        false;


    // =========================================================
    // JUPITER GEOMETRY
    // =========================================================

    const geometry =
        new THREE.SphereGeometry(
            1,
            256,
            256
        );


    // =========================================================
    // MATERIAL
    // =========================================================

    const material =
        new THREE.MeshStandardMaterial({

            color:
                new THREE.Color(
                    0xffffff
                ),

            roughness:
                0.92,

            metalness:
                0.0,

            transparent:
                false

        });


    // =========================================================
    // JUPITER
    // =========================================================

    const jupiter =
        new THREE.Mesh(
            geometry,
            material
        );

    scene.add(
        jupiter
    );


    // =========================================================
    // LOAD 8K TEXTURE
    // =========================================================

    loader.load(

        JUPITER_8K,

        function(texture) {

            console.log(
                "8K JUPITER TEXTURE LOADED"
            );

            textureLoaded =
                true;

            texture.encoding =
                THREE.sRGBEncoding;

            texture.anisotropy =
                renderer.capabilities
                    .getMaxAnisotropy();

            texture.wrapS =
                THREE.RepeatWrapping;

            texture.wrapT =
                THREE.ClampToEdgeWrapping;

            texture.minFilter =
                THREE.LinearMipmapLinearFilter;

            texture.magFilter =
                THREE.LinearFilter;

            texture.generateMipmaps =
                true;

            material.map =
                texture;

            material.needsUpdate =
                true;

        },

        function(xhr) {

            if (xhr.total) {

                const percent =
                    (
                        xhr.loaded /
                        xhr.total
                    ) * 100;

                console.log(
                    "Jupiter 8K:",
                    percent.toFixed(1),
                    "%"
                );
            }

        },

        function(error) {

            console.error(
                "8K Jupiter texture failed.",
                error
            );

            /*
                FALLBACK
                Jupiter will still be visible.
            */

            material.color =
                new THREE.Color(
                    0xb98a64
                );

            material.needsUpdate =
                true;
        }

    );


    // =========================================================
    // JUPITER SHAPE
    // =========================================================

    /*
        Jupiter is an oblate gas giant,
        not a perfect sphere.
    */

    jupiter.scale.set(
        1.0,
        0.955,
        1.0
    );


    // =========================================================
    // JUPITER TILT
    // =========================================================

    jupiter.rotation.z =
        THREE.MathUtils.degToRad(
            3.13
        );


    // =========================================================
    // ATMOSPHERIC EDGE
    // =========================================================

    const atmosphereGeometry =
        new THREE.SphereGeometry(
            1.018,
            160,
            160
        );


    const atmosphereMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xd9a477,

            transparent:
                true,

            opacity:
                0.035,

            side:
                THREE.BackSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const atmosphere =
        new THREE.Mesh(
            atmosphereGeometry,
            atmosphereMaterial
        );

    atmosphere.scale.set(
        1.0,
        0.955,
        1.0
    );

    scene.add(
        atmosphere
    );


    // =========================================================
    // SECOND EDGE GLOW
    // =========================================================

    const glowGeometry =
        new THREE.SphereGeometry(
            1.045,
            128,
            128
        );


    const glowMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xb86d45,

            transparent:
                true,

            opacity:
                0.012,

            side:
                THREE.BackSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const glow =
        new THREE.Mesh(
            glowGeometry,
            glowMaterial
        );

    glow.scale.set(
        1.0,
        0.955,
        1.0
    );

    scene.add(
        glow
    );


    // =========================================================
    // STAR FIELD
    // =========================================================

    const starGeometry =
        new THREE.BufferGeometry();

    const STAR_COUNT =
        5000;

    const starPositions =
        new Float32Array(
            STAR_COUNT * 3
        );


    for (
        let i = 0;
        i < STAR_COUNT;
        i++
    ) {

        const radius =
            35 +
            Math.random() * 120;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                THREE.MathUtils.randFloat(
                    -1,
                    1
                )
            );


        starPositions[i * 3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        starPositions[i * 3 + 1] =
            radius *
            Math.cos(phi);

        starPositions[i * 3 + 2] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);
    }


    starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            starPositions,
            3
        )
    );


    const starMaterial =
        new THREE.PointsMaterial({

            color:
                0xffffff,

            size:
                0.028,

            transparent:
                true,

            opacity:
                0.82,

            depthWrite:
                false

        });


    const stars =
        new THREE.Points(
            starGeometry,
            starMaterial
        );

    scene.add(
        stars
    );


    // =========================================================
    // SUBTLE LIGHT FALL-OFF
    // =========================================================

    const rim =
        new THREE.PointLight(
            0xc47a4c,
            0.45,
            5
        );

    rim.position.set(
        -3,
        0,
        -3
    );

    scene.add(rim);


    // =========================================================
    // ANIMATION
    // =========================================================

    const clock =
        new THREE.Clock();


    function animate() {

        requestAnimationFrame(
            animate
        );


        /*
            Slow visible rotation.
        */

        jupiter.rotation.y +=
            0.00048;


        /*
            Extremely subtle star movement.
        */

        stars.rotation.y +=
            0.000008;


        controls.update();

        renderer.render(
            scene,
            camera
        );
    }


    animate();


    // =========================================================
    // RESIZE
    // =========================================================

    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );


    // =========================================================
    // DEBUG
    // =========================================================

    console.log(
        "Jupiter 8K scene initialized."
    );

</script>

</body>
</html>

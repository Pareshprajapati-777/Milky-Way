<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hyper-Realistic 3D Earth</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 1. Scene, Camera, and Renderer Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 0, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.5;
    controls.maxDistance = 10;

    // 2. Texture Loader & NASA-based Asset Maps
    const textureLoader = new THREE.TextureLoader();
    
    // High-resolution Earth maps (Base color, Bump, Specular, and Clouds)
    const earthDayMap = textureLoader.load('https://raw.githubusercontent.com/Shriisoot/Planets-texture/refs/heads/main/8k_earth_daymap.jpg');
    const earthBumpMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');
    const earthSpecularMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');
    const earthCloudsMap = textureLoader.load('https://raw.githubusercontent.com/Shriisoot/Planets-texture/refs/heads/main/2k_earth_clouds.jpg');

    // 3. Earth Surface Sphere Mesh
    const sphereGeometry = new THREE.SphereGeometry(1, 64, 64);
    // Day + 8K city-light night map
    const earthNightMap = textureLoader.load(
      'https://raw.githubusercontent.com/Shriisoot/Planets-texture/refs/heads/main/8k_earth_nightmap.jpg'
    );

    earthDayMap.encoding = THREE.sRGBEncoding;
    earthNightMap.encoding = THREE.sRGBEncoding;

    earthDayMap.anisotropy = renderer.capabilities.getMaxAnisotropy();
    earthNightMap.anisotropy = renderer.capabilities.getMaxAnisotropy();

    // Custom shader:
    // - daylight uses the normal Earth texture
    // - night side uses the supplied 8K city-light map
    // - transition is soft and physically directional
    // - city lights become emissive, so ambient light does not wash them out
    const earthMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uDayMap: { value: earthDayMap },
        uNightMap: { value: earthNightMap },
        uNormalMap: { value: earthBumpMap },
        uSunDirection: {
          value: new THREE.Vector3(5, 3, 5).normalize()
        },
        uNightIntensity: { value: 1.35 },
        uCityGlow: { value: 1.0 },
        uTime: { value: 0.0 }
      },

      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormalWorld;
        varying vec3 vWorldPosition;

        void main() {
          vUv = uv;

          vec4 worldPosition =
            modelMatrix * vec4(position, 1.0);

          vWorldPosition = worldPosition.xyz;

          vNormalWorld =
            normalize(
              mat3(modelMatrix) * normal
            );

          gl_Position =
            projectionMatrix *
            viewMatrix *
            worldPosition;
        }
      `,

      fragmentShader: `
        uniform sampler2D uDayMap;
        uniform sampler2D uNightMap;
        uniform sampler2D uNormalMap;

        uniform vec3 uSunDirection;
        uniform float uNightIntensity;
        uniform float uCityGlow;
        uniform float uTime;

        varying vec2 vUv;
        varying vec3 vNormalWorld;
        varying vec3 vWorldPosition;

        void main() {

          vec3 dayColor =
            texture2D(uDayMap, vUv).rgb;

          vec3 nightColor =
            texture2D(uNightMap, vUv).rgb;

          // Normal-map detail in tangent-space approximation.
          vec3 mapNormal =
            texture2D(uNormalMap, vUv).rgb * 2.0 - 1.0;

          // Keep the effect subtle; the night map is primarily an
          // emissive city-light map rather than a surface albedo.
          float normalDetail =
            clamp(
              0.96 + mapNormal.z * 0.04,
              0.90,
              1.02
            );

          vec3 N =
            normalize(vNormalWorld);

          vec3 L =
            normalize(uSunDirection);

          float sunFacing =
            dot(N, L);

          // Smooth terminator:
          // positive = day, negative = night.
          float dayMask =
            smoothstep(
              -0.08,
              0.22,
              sunFacing
            );

          // Stronger city lights deeper into night.
          float nightMask =
            1.0 -
            smoothstep(
              -0.18,
              0.10,
              sunFacing
            );

          // Small twilight band so the transition isn't a hard cut.
          float twilight =
            1.0 -
            abs(
              smoothstep(-0.18, 0.18, sunFacing) - 0.5
            ) * 2.0;

          twilight =
            clamp(twilight, 0.0, 1.0);

          // Day hemisphere keeps natural texture.
          vec3 daylight =
            dayColor *
            (
              0.18 +
              0.82 *
              max(sunFacing, 0.0)
            );

          // City lights are emissive.
          vec3 city =
            nightColor *
            uNightIntensity *
            uCityGlow;

          // Slightly warmer visible city glow.
          city *= vec3(
            1.00,
            0.93,
            0.78
          );

          // Twilight contains a very small mixture of both.
          vec3 finalColor =
            daylight * dayMask +
            city * nightMask;

          // Preserve some natural Earth visibility at terminator.
          finalColor +=
            dayColor *
            twilight *
            0.045;

          finalColor *= normalDetail;

          // Mild HDR-style city-light lift without blowing out texture.
          finalColor +=
            city *
            nightMask *
            0.12;

          gl_FragColor =
            vec4(finalColor, 1.0);
        }
      `
    });

    const earthMesh =
      new THREE.Mesh(
        sphereGeometry,
        earthMaterial
      );

    scene.add(earthMesh);

    // 4. Cloud Layer Sphere (slightly larger radius)
    const cloudGeometry = new THREE.SphereGeometry(1.008, 64, 64);
    const cloudMaterial = new THREE.MeshStandardMaterial({
      map: earthCloudsMap,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
    scene.add(cloudMesh);

    // 5. Starfield Background
    const starsGeometry = new THREE.BufferGeometry();
    const starCount = 1500;
    const starPositions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 100;
      starPositions[i + 1] = (Math.random() - 0.5) * 100;
      starPositions[i + 2] = (Math.random() - 0.5) * 100;
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25 });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // 6. Lighting
    // Ambient light prevents unlit hemisphere from going completely pitch black
    const ambientLight = new THREE.AmbientLight(0x050711, 0.08);
    scene.add(ambientLight);

    // Sunlight source
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
    sunLight.position.set(5, 3, 5);
    scene.add(sunLight);

    // Earth axial tilt (approx. 23.4 degrees)
    const tilt = THREE.MathUtils.degToRad(23.4);
    earthMesh.rotation.z = tilt;
    cloudMesh.rotation.z = tilt;

    // 7. Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      // Rotate Earth surface
      earthMesh.rotation.y += 0.0008;

      earthMaterial.uniforms.uTime.value =
        performance.now() * 0.001;

      // Rotate clouds slightly faster for atmospheric drift
      cloudMesh.rotation.y += 0.0011;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 8. Responsive Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

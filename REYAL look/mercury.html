<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mercury 3D - Three.js</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

    // =====================================================
    // SCENE
    // =====================================================

    const container =
        document.getElementById("canvas-container");

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x000000);


    // =====================================================
    // CAMERA
    // =====================================================

    const camera =
        new THREE.PerspectiveCamera(
            42,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );

    camera.position.set(
        0,
        0,
        3.0
    );


    // =====================================================
    // RENDERER
    // =====================================================

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.2;

    container.appendChild(
        renderer.domElement
    );


    // =====================================================
    // CONTROLS
    // =====================================================

    const controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.dampingFactor = 0.04;

    controls.enablePan = false;

    controls.minDistance = 1.45;

    controls.maxDistance = 7;

    controls.autoRotate = true;

    controls.autoRotateSpeed = 0.12;


    // =====================================================
    // LIGHTING FIRST
    // =====================================================

    const sun =
        new THREE.DirectionalLight(
            0xffead5,
            3.5
        );

    sun.position.set(
        4,
        2,
        5
    );

    scene.add(sun);


    const fill =
        new THREE.DirectionalLight(
            0x7d5140,
            0.35
        );

    fill.position.set(
        -4,
        -1,
        -4
    );

    scene.add(fill);


    const ambient =
        new THREE.AmbientLight(
            0x5a4038,
            0.45
        );

    scene.add(ambient);


    // =====================================================
    // MERCURY TEXTURE
    // =====================================================

    const loader =
        new THREE.TextureLoader();

    loader.crossOrigin = "anonymous";


    /*
        Reliable GitHub-hosted 8K/2K planetary texture.

        This repository contains 8k_mercury.jpg.
    */

    const mercuryTextureURL =
        "https://raw.githubusercontent.com/Shriisoot/Planets-texture/main/8k_mercury.jpg";


    const mercuryTexture =
        loader.load(

            mercuryTextureURL,

            function(texture) {

                console.log(
                    "Mercury texture loaded successfully"
                );

                texture.encoding =
                    THREE.sRGBEncoding;

                texture.anisotropy =
                    renderer.capabilities
                        .getMaxAnisotropy();

                mercury.material.map =
                    texture;

                mercury.material.color.set(
                    0xffffff
                );

                mercury.material.needsUpdate =
                    true;
            },

            function(progress) {

                console.log(
                    "Loading Mercury texture..."
                );
            },

            function(error) {

                console.error(
                    "Mercury texture failed:",
                    error
                );

                /*
                    Fallback color.
                    The planet will still render.
                */

                mercury.material.map =
                    null;

                mercury.material.color.set(
                    0x8b7167
                );

                mercury.material.needsUpdate =
                    true;
            }
        );


    // =====================================================
    // MERCURY GEOMETRY
    // =====================================================

    const geometry =
        new THREE.SphereGeometry(
            1,
            192,
            192
        );


    // =====================================================
    // MERCURY MATERIAL
    // =====================================================

    const material =
        new THREE.MeshPhongMaterial({

            color:
                0xffffff,

            map:
                mercuryTexture,

            specular:
                new THREE.Color(
                    0x17120f
                ),

            shininess:
                4,

            reflectivity:
                0.05

        });


    // =====================================================
    // MERCURY MESH
    // =====================================================

    const mercury =
        new THREE.Mesh(
            geometry,
            material
        );

    scene.add(
        mercury
    );


    // =====================================================
    // MERCURY ROTATION
    // =====================================================

    mercury.rotation.z =
        THREE.MathUtils.degToRad(
            7
        );


    // =====================================================
    // VERY SUBTLE EDGE GLOW
    // =====================================================

    const glowGeometry =
        new THREE.SphereGeometry(
            1.025,
            96,
            96
        );


    const glowMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xb98d76,

            transparent:
                true,

            opacity:
                0.025,

            side:
                THREE.BackSide,

            depthWrite:
                false,

            blending:
                THREE.AdditiveBlending

        });


    const glow =
        new THREE.Mesh(
            glowGeometry,
            glowMaterial
        );

    scene.add(
        glow
    );


    // =====================================================
    // STARS
    // =====================================================

    const starGeometry =
        new THREE.BufferGeometry();

    const starCount =
        4000;

    const starPositions =
        new Float32Array(
            starCount * 3
        );


    for (
        let i = 0;
        i < starCount;
        i++
    ) {

        const radius =
            35 +
            Math.random() * 100;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                THREE.MathUtils.randFloat(
                    -1,
                    1
                )
            );


        starPositions[
            i * 3
        ] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);


        starPositions[
            i * 3 + 1
        ] =
            radius *
            Math.cos(phi);


        starPositions[
            i * 3 + 2
        ] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);
    }


    starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            starPositions,
            3
        )
    );


    const starMaterial =
        new THREE.PointsMaterial({

            color:
                0xffffff,

            size:
                0.035,

            transparent:
                true,

            opacity:
                0.8,

            depthWrite:
                false

        });


    const stars =
        new THREE.Points(
            starGeometry,
            starMaterial
        );

    scene.add(
        stars
    );


    // =====================================================
    // ANIMATION
    // =====================================================

    function animate() {

        requestAnimationFrame(
            animate
        );


        /*
            Very slow rotation.
        */

        mercury.rotation.y +=
            0.00045;


        controls.update();


        renderer.render(
            scene,
            camera
        );
    }


    animate();


    // =====================================================
    // RESIZE
    // =====================================================

    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>
</html>

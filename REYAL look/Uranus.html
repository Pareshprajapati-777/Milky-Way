<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Realistic Uranus 8K</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    color:white;
    font-family:Arial;
    font-size:18px;
    z-index:10;
}
</style>
</head>

<body>

<div id="loading">
    Loading Uranus 8K...
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

// =====================================================
// SCENE
// =====================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


// =====================================================
// CAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.01,
        1000
    );

camera.position.set(
    0,
    1.0,
    4.5
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

renderer.physicallyCorrectLights =
    true;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// CONTROLS
// =====================================================

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.035;

controls.enablePan = false;

controls.minDistance = 2.3;

controls.maxDistance = 10;

controls.target.set(
    0,
    0,
    0
);


// =====================================================
// TEXTURE LOADER
// =====================================================

const loader =
    new THREE.TextureLoader();


// =====================================================
// URANUS 8K TEXTURE
// =====================================================

const uranusTexture =
    loader.load(

        "https://raw.githubusercontent.com/Shrey1803/Solar-system/main/textures/2k_uranus.jpg",

        function(texture){

            texture.encoding =
                THREE.sRGBEncoding;

            texture.anisotropy =
                renderer
                .capabilities
                .getMaxAnisotropy();

            texture.generateMipmaps =
                true;

            texture.minFilter =
                THREE.LinearMipmapLinearFilter;

            texture.magFilter =
                THREE.LinearFilter;

            texture.needsUpdate =
                true;

            document.getElementById(
                "loading"
            ).style.display =
                "none";
        },

        undefined,

        function(){

            console.error(
                "Uranus texture failed"
            );

            document.getElementById(
                "loading"
            ).innerHTML =
                "Texture failed to load";
        }
    );


// =====================================================
// URANUS BODY
// =====================================================

const uranusGeometry =
    new THREE.SphereGeometry(
        1,
        256,
        256
    );


const uranusMaterial =
    new THREE.MeshPhongMaterial({

        map:uranusTexture,

        color:0x78999b,

        shininess:4,

        specular:
            new THREE.Color(
                0x173a40
            )
    });


const uranus =
    new THREE.Mesh(
        uranusGeometry,
        uranusMaterial
    );


// =====================================================
// URANUS SLIGHT FLATTENING
// =====================================================

uranus.scale.set(
    1,
    0.978,
    1
);


// =====================================================
// URANUS AXIAL TILT
// =====================================================

// Uranus is almost sideways

uranus.rotation.z =
    THREE.MathUtils.degToRad(
        97.77
    );

scene.add(
    uranus
);


// =====================================================
// ATMOSPHERE
// =====================================================

const atmosphereGeometry =
    new THREE.SphereGeometry(
        1.025,
        160,
        160
    );


const atmosphereMaterial =
    new THREE.ShaderMaterial({

        transparent:true,

        side:THREE.BackSide,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false,

        uniforms:{

            glowColor:{
                value:
                new THREE.Color(
                    0x31585c
                )
            }
        },

        vertexShader:`

            varying vec3 vNormal;
            varying vec3 vWorldPosition;

            void main(){

                vNormal =
                    normalize(
                        normalMatrix *
                        normal
                    );

                vec4 worldPosition =
                    modelMatrix *
                    vec4(
                        position,
                        1.0
                    );

                vWorldPosition =
                    worldPosition.xyz;

                gl_Position =
                    projectionMatrix *
                    viewMatrix *
                    worldPosition;
            }

        `,

        fragmentShader:`

            uniform vec3 glowColor;

            varying vec3 vNormal;

            varying vec3 vWorldPosition;

            void main(){

                vec3 viewDirection =
                    normalize(
                        cameraPosition -
                        vWorldPosition
                    );

                float rim =
                    1.0 -
                    max(
                        dot(
                            vNormal,
                            viewDirection
                        ),
                        0.0
                    );

                rim =
                    pow(
                        rim,
                        3.5
                    );

                gl_FragColor =
                    vec4(
                        glowColor,
                        rim * 0.16
                    );
            }

        `
    });


const atmosphere =
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    );

atmosphere.scale.set(
    1,
    0.978,
    1
);

atmosphere.rotation.z =
    THREE.MathUtils.degToRad(
        97.77
    );

scene.add(
    atmosphere
);


// =====================================================
// URANUS RINGS
// =====================================================

const ringGroup =
    new THREE.Group();


// Uranus has very thin dark rings

function makeRing(
    inner,
    outer,
    opacity
){

    const geometry =
        new THREE.RingGeometry(
            inner,
            outer,
            512,
            32
        );


    const material =
        new THREE.MeshPhongMaterial({

            color:
                new THREE.Color(
                    0x6c7775
                ),

            transparent:true,

            opacity:opacity,

            side:
                THREE.DoubleSide,

            depthWrite:false,

            shininess:1
        });


    const ring =
        new THREE.Mesh(
            geometry,
            material
        );


    ring.rotation.x =
        Math.PI / 2;


    return ring;
}


// =====================================================
// MAIN URANUS RINGS
// =====================================================

ringGroup.add(
    makeRing(
        1.18,
        1.205,
        0.42
    )
);

ringGroup.add(
    makeRing(
        1.23,
        1.245,
        0.32
    )
);

ringGroup.add(
    makeRing(
        1.28,
        1.295,
        0.40
    )
);

ringGroup.add(
    makeRing(
        1.34,
        1.355,
        0.28
    )
);

ringGroup.add(
    makeRing(
        1.41,
        1.425,
        0.30
    )
);


// =====================================================
// RING PARTICLES
// =====================================================

const particleCount =
    9000;

const positions =
    new Float32Array(
        particleCount * 3
    );


for(
    let i = 0;
    i < particleCount;
    i++
){

    const angle =
        Math.random() *
        Math.PI * 2;


    const radius =
        1.17 +
        Math.random() *
        0.28;


    const x =
        Math.cos(angle) *
        radius;


    const z =
        Math.sin(angle) *
        radius;


    const y =
        (Math.random() - 0.5)
        * 0.003;


    positions[i * 3] =
        x;

    positions[i * 3 + 1] =
        y;

    positions[i * 3 + 2] =
        z;
}


const particleGeometry =
    new THREE.BufferGeometry();


particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({

        color:
            0x8b9691,

        size:
            0.004,

        transparent:true,

        opacity:0.45,

        depthWrite:false
    });


const ringParticles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

ringParticles.rotation.x =
    Math.PI / 2;

ringGroup.add(
    ringParticles
);


// =====================================================
// RING TILT
// =====================================================

ringGroup.rotation.z =
    THREE.MathUtils.degToRad(
        97.77
    );

scene.add(
    ringGroup
);


// =====================================================
// SUBTLE ATMOSPHERIC BANDS
// =====================================================

const bandGeometry =
    new THREE.SphereGeometry(
        1.006,
        256,
        256
    );


const bandMaterial =
    new THREE.ShaderMaterial({

        transparent:true,

        depthWrite:false,

        uniforms:{

            baseColor:{
                value:
                new THREE.Color(
                    0x70cfd1
                )
            }
        },

        vertexShader:`

            varying vec2 vUv;

            void main(){

                vUv = uv;

                gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(
                        position,
                        1.0
                    );
            }

        `,

        fragmentShader:`

            uniform vec3 baseColor;

            varying vec2 vUv;

            void main(){

                float bands =
                    sin(
                        vUv.y *
                        90.0
                    );

                bands =
                    smoothstep(
                        0.35,
                        0.65,
                        bands
                    );

                float strength =
                    bands * 0.025;

                gl_FragColor =
                    vec4(
                        baseColor,
                        strength
                    );
            }

        `
    });


const bands =
    new THREE.Mesh(
        bandGeometry,
        bandMaterial
    );

bands.scale.set(
    1,
    0.978,
    1
);

bands.rotation.z =
    THREE.MathUtils.degToRad(
        97.77
    );

scene.add(
    bands
);


// =====================================================
// STARS
// =====================================================

const starCount =
    9000;

const starPositions =
    new Float32Array(
        starCount * 3
    );


for(
    let i = 0;
    i < starCount;
    i++
){

    const radius =
        30 +
        Math.random() *
        150;


    const theta =
        Math.random() *
        Math.PI * 2;


    const phi =
        Math.acos(
            2 * Math.random() - 1
        );


    starPositions[i * 3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);


    starPositions[i * 3 + 1] =
        radius *
        Math.cos(phi);


    starPositions[i * 3 + 2] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);
}


const starGeometry =
    new THREE.BufferGeometry();


starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({

        color:0x78999b,

        size:0.035,

        transparent:true,

        opacity:0.85,

        depthWrite:false
    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(
    stars
);


// =====================================================
// SUN LIGHT
// =====================================================

const sunLight =
    new THREE.DirectionalLight(
        0xe9ffff,
        4.5
    );

sunLight.position.set(
    -6,
    3,
    5
);

scene.add(
    sunLight
);


// =====================================================
// BLUE FILL LIGHT
// =====================================================

const fillLight =
    new THREE.PointLight(
        0x27484b,
        0.35,
        20
    );

fillLight.position.set(
    4,
    2,
    4
);

scene.add(
    fillLight
);


// =====================================================
// AMBIENT
// =====================================================

const ambient =
    new THREE.AmbientLight(
        0x3c6568,
        0.28
    );

scene.add(
    ambient
);


// =====================================================
// ANIMATION
// =====================================================

function animate(){

    requestAnimationFrame(
        animate
    );


    // Uranus rotation
    uranus.rotation.y +=
        0.00032;


    // Atmosphere
    atmosphere.rotation.y =
        uranus.rotation.y;


    // Subtle bands
    bands.rotation.y =
        uranus.rotation.y;


    // Rings
    ringGroup.rotation.y +=
        0.00006;


    // Stars
    stars.rotation.y +=
        0.00001;


    controls.update();


    renderer.render(
        scene,
        camera
    );
}

animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>

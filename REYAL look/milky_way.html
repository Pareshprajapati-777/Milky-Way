<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

<title>Milky Way 6 Arm - Master 3D</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;

    display: block;

    position: fixed;

        opacity 1.2s ease;

            255,

        );

    font-family:
        Arial,
        sans-serif;

    font-size: 9px;

    pointer-events: none;

<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}

</script>

</head>


<body>


<div id="loading">
    INITIALIZING SIX-ARM GALACTIC STRUCTURE
</div>


<div id="hud">
    MILKY WAY • SIX ARM PROCEDURAL GALACTIC MODEL
</div>


<script type="module">


import * as THREE
from
"three";


import {
    OrbitControls
}
from
"three/addons/controls/OrbitControls.js";


import {
    EffectComposer
}
from
"three/addons/postprocessing/EffectComposer.js";


import {
    RenderPass
}
from
"three/addons/postprocessing/RenderPass.js";


import {
    UnrealBloomPass
}
from
"three/addons/postprocessing/UnrealBloomPass.js";


// ============================================================
// MASTER SETTINGS
// ============================================================

const SETTINGS = {

    galaxyStars:
        240000,

    backgroundStars:
        45000,

    nebulaParticles:
        32000,

    dustParticles:
        28000,

    starFormation:
        11000,

    galaxyRadius:
        62,

    bulgeRadius:
        9,

    diskThickness:
        3.2,

    /*
        Lower value = more open arms.
        Higher value = tighter spiral.
    */

    spiralCurve:
        0.235,

    /*
        Width of the six arms.
    */

    armWidth:
        0.19,

    pixelRatio:
        Math.min(
            window.devicePixelRatio,
            2
        ),

    bloomStrength:
        1.15,

    bloomRadius:
        0.72,

    bloomThreshold:
        0.035

};


// ============================================================
// SCENE
// ============================================================

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x000003
    );


// ============================================================
// CAMERA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(

        46,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );


camera.position.set(
    0,
    28,
    86
);


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias:
            true,

        powerPreference:
            "high-performance"

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    SETTINGS.pixelRatio
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.18;


document.body.appendChild(
    renderer.domElement
);


// ============================================================
// POST PROCESSING
// ============================================================

const composer =
    new EffectComposer(
        renderer
    );


const renderPass =
    new RenderPass(
        scene,
        camera
    );


composer.addPass(
    renderPass
);


const bloom =
    new UnrealBloomPass(

        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),

        SETTINGS.bloomStrength,

        SETTINGS.bloomRadius,

        SETTINGS.bloomThreshold

    );


composer.addPass(
    bloom
);


// ============================================================
// CONTROLS
// ============================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );


controls.enableDamping =
    true;


controls.dampingFactor =
    0.035;


controls.enablePan =
    false;


controls.minDistance =
    30;


controls.maxDistance =
    170;


controls.autoRotate =
    true;


controls.autoRotateSpeed =
    0.08;


// ============================================================
// GALAXY ROOT
// ============================================================

const galaxy =
    new THREE.Group();


scene.add(
    galaxy
);


// ============================================================
// COLOR SYSTEM
// ============================================================

const COLOR = {

    deepBlue:
        new THREE.Color(
            "#274dff"
        ),

    blue:
        new THREE.Color(
            "#4f8dff"
        ),

    cyan:
        new THREE.Color(
            "#59d8ff"
        ),

    violet:
        new THREE.Color(
            "#8268ff"
        ),

    purple:
        new THREE.Color(
            "#b25cff"
        ),

    pink:
        new THREE.Color(
            "#ff6fae"
        ),

    red:
        new THREE.Color(
            "#ff5368"
        ),

    orange:
        new THREE.Color(
            "#ff9b52"
        ),

    gold:
        new THREE.Color(
            "#ffc96b"
        ),

    warm:
        new THREE.Color(
            "#ffe4a8"
        ),

    white:
        new THREE.Color(
            "#fff9e8"
        )

};


// ============================================================
// UTILITY
// ============================================================

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function angularDifference(
    a,
    b
) {

    let d =
        Math.abs(
            a - b
        );


    if (
        d >
        Math.PI
    ) {

        d =
            Math.PI * 2 -
            d;

    }


    return d;

}


// ============================================================
// SIX ARM STRUCTURE
// ============================================================

/*
    IMPORTANT:

    There are now SIX arms.

    They are deliberately NOT identical.

    This prevents the galaxy from looking
    like six perfect rings.
*/

const ARMS = [

    // ========================================================
    // ARM 1 - DOMINANT
    // ========================================================

    {
        phase:
            0.12,

        strength:
            1.00,

        width:
            1.00,

        offset:
            0.00
    },


    // ========================================================
    // ARM 2 - DOMINANT
    // ========================================================

    {
        phase:
            Math.PI / 3 +
            0.18,

        strength:
            0.94,

        width:
            1.04,

        offset:
            0.25
    },


    // ========================================================
    // ARM 3 - MEDIUM
    // ========================================================

    {
        phase:
            Math.PI * 2 / 3 -
            0.12,

        strength:
            0.72,

        width:
            0.90,

        offset:
            -0.25
    },


    // ========================================================
    // ARM 4 - MEDIUM
    // ========================================================

    {
        phase:
            Math.PI +
            0.08,

        strength:
            0.70,

        width:
            0.92,

        offset:
            0.30
    },


    // ========================================================
    // ARM 5 - WEAK
    // ========================================================

    {
        phase:
            Math.PI * 4 / 3 -
            0.17,

        strength:
            0.48,

        width:
            0.78,

        offset:
            -0.40
    },


    // ========================================================
    // ARM 6 - WEAK
    // ========================================================

    {
        phase:
            Math.PI * 5 / 3 +
            0.10,

        strength:
            0.44,

        width:
            0.76,

        offset:
            0.48
    }

];


// ============================================================
// SPIRAL EQUATION
// ============================================================

function armAngle(
    radius,
    arm
) {

    const normalized =
        radius /
        SETTINGS.galaxyRadius;


    /*
        Non-linear curvature.

        This prevents simple circular
        ring formation.
    */

    const curvature =
        SETTINGS.spiralCurve *
        Math.pow(
            normalized,
            0.82
        );


    /*
        Slight radial distortion.
    */

    const distortion =
        arm.offset *
        Math.sin(
            radius *
            0.13
        );


    return (

        arm.phase +

        curvature *
        radius *
        0.82 +

        distortion

    );

}


// ============================================================
// FIND CLOSEST ARM
// ============================================================

function nearestArm(
    radius,
    angle
) {

    let best =
        Infinity;

    let strength =
        0;

    let width =
        1;

    let index =
        0;


    for (
        let i = 0;
        i < ARMS.length;
        i++
    ) {

        const arm =
            ARMS[i];


        const target =
            armAngle(
                radius,
                arm
            );


        const difference =
            angularDifference(
                angle,
                target
            );


        const normalized =
            difference /
            (
                SETTINGS.armWidth *
                arm.width
            );


        if (
            normalized <
            best
        ) {

            best =
                normalized;

            strength =
                arm.strength;

            width =
                arm.width;

            index =
                i;

        }

    }


    return {

        distance:
            best,

        strength:
            strength,

        width:
            width,

        index:
            index

    };

}


// ============================================================
// STAR COLOR
// ============================================================

function getStarColor(
    radius,
    armDensity,
    random
) {

    const color =
        new THREE.Color();


    // --------------------------------------------------------
    // GALACTIC CORE
    // --------------------------------------------------------

    if (
        radius <
        SETTINGS.bulgeRadius
    ) {

        if (
            random <
            0.38
        ) {

            color.copy(
                COLOR.white
            );

        }
        else if (
            random <
            0.75
        ) {

            color.copy(
                COLOR.warm
            );

        }
        else {

            color.copy(
                COLOR.gold
            );

        }


        return color;

    }


    // --------------------------------------------------------
    // INNER DISK
    // --------------------------------------------------------

    if (
        radius <
        17
    ) {

        color.copy(

            random <
            0.58

                ? COLOR.gold

                : COLOR.warm

        );


        return color;

    }


    // --------------------------------------------------------
    // SPIRAL ARM STARS
    // --------------------------------------------------------

    if (
        armDensity >
        0.5
    ) {

        if (
            random <
            0.22
        ) {

            color.copy(
                COLOR.cyan
            );

        }
        else if (
            random <
            0.45
        ) {

            color.copy(
                COLOR.blue
            );

        }
        else if (
            random <
            0.65
        ) {

            color.copy(
                COLOR.violet
            );

        }
        else if (
            random <
            0.84
        ) {

            color.copy(
                COLOR.purple
            );

        }
        else {

            color.copy(
                COLOR.pink
            );

        }


        return color;

    }


    // --------------------------------------------------------
    // OUTER DISK
    // --------------------------------------------------------

    const r =
        Math.random();


    if (
        r <
        0.45
    ) {

        color.copy(
            COLOR.blue
        );

    }
    else if (
        r <
        0.68
    ) {

        color.copy(
            COLOR.deepBlue
        );

    }
    else if (
        r <
        0.83
    ) {

        color.copy(
            COLOR.violet
        );

    }
    else {

        color.copy(
            COLOR.white
        );

    }


    return color;

}


// ============================================================
// MAIN GALAXY STARS
// ============================================================

function createGalaxyStars() {

    const count =
        SETTINGS.galaxyStars;


    const positions =
        new Float32Array(
            count * 3
        );


    const colors =
        new Float32Array(
            count * 3
        );


    const sizes =
        new Float32Array(
            count
        );


    const alphas =
        new Float32Array(
            count
        );


    const randoms =
        new Float32Array(
            count
        );


    const color =
        new THREE.Color();


    for (
        let i = 0;
        i < count;
        i++
    ) {

        // ----------------------------------------------------
        // RADIAL DISTRIBUTION
        // ----------------------------------------------------

        let radius;


        if (
            Math.random() <
            0.22
        ) {

            radius =
                Math.pow(
                    Math.random(),
                    1.9
                ) *
                27;

        }
        else {

            radius =
                8 +
                Math.pow(
                    Math.random(),
                    0.63
                ) *
                54;

        }


        // ----------------------------------------------------
        // INITIAL ANGLE
        // ----------------------------------------------------

        let angle =
            Math.random() *
            Math.PI *
            2;


        /*
            Most stars belong to a spiral arm,
            but not all.

            This is critical for avoiding
            artificial "ring" geometry.
        */

        if (
            Math.random() <
            0.74
        ) {

            const selectedArm =
                ARMS[
                    Math.floor(
                        Math.random() *
                        ARMS.length
                    )
                ];


            const target =
                armAngle(
                    radius,
                    selectedArm
                );


            const spread =
                SETTINGS.armWidth *
                selectedArm.width *
                (
                    0.15 +
                    Math.random() *
                    1.45
                );


            angle =
                target +
                THREE.MathUtils.randFloatSpread(
                    spread
                );

        }


        // ----------------------------------------------------
        // ARM DENSITY
        // ----------------------------------------------------

        const localArm =
            nearestArm(
                radius,
                angle
            );


        const armDensity =
            Math.exp(
                -Math.pow(
                    localArm.distance,
                    2
                ) *
                1.6
            ) *
            localArm.strength;


        // ----------------------------------------------------
        // CLUMPING
        // ----------------------------------------------------

        const clump =
            0.72 +
            Math.pow(
                Math.random(),
                3
            ) *
            1.6;


        // ----------------------------------------------------
        // RADIAL IRREGULARITY
        // ----------------------------------------------------

        let actualRadius =
            radius;


        /*
            Radial displacement destroys
            the artificial perfect-ring effect.
        */

        actualRadius +=
            THREE.MathUtils.randFloatSpread(

                1.7 +
                armDensity *
                2.6

            );


        // ----------------------------------------------------
        // POSITION
        // ----------------------------------------------------

        const x =
            Math.cos(
                angle
            ) *
            actualRadius;


        const z =
            Math.sin(
                angle
            ) *
            actualRadius;


        // ----------------------------------------------------
        // GALACTIC THICKNESS
        // ----------------------------------------------------

        const thickness =
            SETTINGS.diskThickness *
            (
                0.25 +
                0.85 *
                Math.exp(
                    -radius / 27
                )
            );


        let y =
            THREE.MathUtils.randFloatSpread(
                thickness
            );


        /*
            Slight warped disk.
        */

        y +=
            Math.sin(
                angle * 2.0 +
                radius * 0.11
            ) *
            (
                radius /
                SETTINGS.galaxyRadius
            ) *
            0.45;


        // ----------------------------------------------------
        // SAVE POSITION
        // ----------------------------------------------------

        positions[i * 3] =
            x;

        positions[i * 3 + 1] =
            y;

        positions[i * 3 + 2] =
            z;


        // ----------------------------------------------------
        // STAR COLOR
        // ----------------------------------------------------

        color.copy(

            getStarColor(
                radius,
                armDensity,
                Math.random()
            )

        );


        // ----------------------------------------------------
        // BRIGHTNESS
        // ----------------------------------------------------

        const brightness =
            (
                0.52 +
                Math.random() *
                0.62
            ) *
            (
                0.72 +
                armDensity *
                0.38
            ) *
            clump;


        color.multiplyScalar(
            brightness
        );


        colors[i * 3] =
            color.r;

        colors[i * 3 + 1] =
            color.g;

        colors[i * 3 + 2] =
            color.b;


        // ----------------------------------------------------
        // STAR SIZE
        // ----------------------------------------------------

        let size =
            0.45 +
            Math.pow(
                Math.random(),
                8
            ) *
            4.8;


        size *=
            0.75 +
            armDensity *
            0.55;


        if (
            radius <
            SETTINGS.bulgeRadius
        ) {

            size *=
                0.85;

        }


        sizes[i] =
            size;


        alphas[i] =
            0.42 +
            Math.random() *
            0.58;


        randoms[i] =
            Math.random();

    }


    // ========================================================
    // GEOMETRY
    // ========================================================

    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )

    );


    geometry.setAttribute(

        "color",

        new THREE.BufferAttribute(
            colors,
            3
        )

    );


    geometry.setAttribute(

        "aSize",

        new THREE.BufferAttribute(
            sizes,
            1
        )

    );


    geometry.setAttribute(

        "aAlpha",

        new THREE.BufferAttribute(
            alphas,
            1
        )

    );


    geometry.setAttribute(

        "aRandom",

        new THREE.BufferAttribute(
            randoms,
            1
        )

    );


    // ========================================================
    // STAR SHADER
    // ========================================================

    const material =
        new THREE.ShaderMaterial({

        transparent:
            true,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending,

        vertexColors:
            true,

        uniforms: {

            uTime: {
                value: 0
            },

            uPixelRatio: {
                value:
                    SETTINGS.pixelRatio
            }

        },


        vertexShader: `

            attribute float aSize;
            attribute float aAlpha;
            attribute float aRandom;

            uniform float uTime;
            uniform float uPixelRatio;

            varying vec3 vColor;
            varying float vAlpha;


            void main() {

                vec3 p =
                    position;


                float shimmer =
                    sin(
                        uTime * 0.7 +
                        aRandom * 80.0
                    );


                p *=
                    1.0 +
                    shimmer *
                    0.008;


                vec4 mvPosition =
                    modelViewMatrix *
                    vec4(
                        p,
                        1.0
                    );


                gl_PointSize =
                    aSize *
                    uPixelRatio *
                    (
                        125.0 /
                        -mvPosition.z
                    );


                gl_PointSize =
                    clamp(
                        gl_PointSize,
                        0.35,
                        18.0
                    );


                gl_Position =
                    projectionMatrix *
                    mvPosition;


                vColor =
                    color;

                vAlpha =
                    aAlpha;

            }

        `,


        fragmentShader: `

            varying vec3 vColor;

            varying float vAlpha;


            void main() {

                vec2 uv =
                    gl_PointCoord -
                    0.5;


                float d =
                    length(
                        uv
                    );


                float glow =
                    1.0 -
                    smoothstep(
                        0.0,
                        0.5,
                        d
                    );


                float core =
                    1.0 -
                    smoothstep(
                        0.0,
                        0.13,
                        d
                    );


                float crossX =
                    exp(
                        -abs(
                            uv.y
                        ) *
                        38.0
                    );


                float crossY =
                    exp(
                        -abs(
                            uv.x
                        ) *
                        38.0
                    );


                float sparkle =
                    (
                        crossX +
                        crossY
                    ) *
                    0.10;


                float alpha =
                    (
                        glow *
                        0.72 +
                        core *
                        1.8 +
                        sparkle
                    ) *
                    vAlpha;


                if (
                    alpha <
                    0.008
                )
                    discard;


                gl_FragColor =
                    vec4(
                        vColor,
                        alpha
                    );

            }

        `

    });


    const stars =
        new THREE.Points(
            geometry,
            material
        );


    galaxy.add(
        stars
    );


    return material;

}


const galaxyMaterial =
    createGalaxyStars();


// ============================================================
// CENTRAL GALACTIC BULGE
// ============================================================

function createBulge() {

    const group =
        new THREE.Group();


    // --------------------------------------------------------
    // OUTER BULGE
    // --------------------------------------------------------

    const outerGeometry =
        new THREE.SphereGeometry(
            8.8,
            64,
            64
        );


    const outerMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xffc978,

            transparent:
                true,

            opacity:
                0.075,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const outer =
        new THREE.Mesh(
            outerGeometry,
            outerMaterial
        );


    outer.scale.y =
        0.56;


    group.add(
        outer
    );


    // --------------------------------------------------------
    // INNER CORE
    // --------------------------------------------------------

    const innerGeometry =
        new THREE.SphereGeometry(
            4.3,
            64,
            64
        );


    const innerMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0xffffd2,

            transparent:
                true,

            opacity:
                0.18,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const inner =
        new THREE.Mesh(
            innerGeometry,
            innerMaterial
        );


    inner.scale.y =
        0.58;


    group.add(
        inner
    );


    // --------------------------------------------------------
    // CORE LIGHT
    // --------------------------------------------------------

    const light =
        new THREE.PointLight(

            0xffc16a,

            32,

            65

        );


    group.add(
        light
    );


    galaxy.add(
        group
    );

}


createBulge();


// ============================================================
// CENTRAL BAR
// ============================================================

function createCentralBar() {

    const count =
        15000;


    const positions =
        new Float32Array(
            count * 3
        );


    const colors =
        new Float32Array(
            count * 3
        );


    const sizes =
        new Float32Array(
            count
        );


    const color =
        new THREE.Color();


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const x =
            THREE.MathUtils.randFloatSpread(
                15
            );


        const width =
            1.7 *
            (
                1 -
                Math.abs(x) /
                8
            );


        positions[i * 3] =
            x;


        positions[i * 3 + 1] =
            THREE.MathUtils.randFloatSpread(
                width
            );


        positions[i * 3 + 2] =
            THREE.MathUtils.randFloatSpread(
                width *
                0.75
            );


        color.copy(

            Math.random() <
            0.7

                ? COLOR.gold

                : COLOR.warm

        );


        color.multiplyScalar(
            0.6 +
            Math.random() *
            0.55
        );


        colors[i * 3] =
            color.r;

        colors[i * 3 + 1] =
            color.g;

        colors[i * 3 + 2] =
            color.b;


        sizes[i] =
            0.5 +
            Math.random() *
            2.2;

    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )

    );


    geometry.setAttribute(

        "color",

        new THREE.BufferAttribute(
            colors,
            3
        )

    );


    geometry.setAttribute(

        "aSize",

        new THREE.BufferAttribute(
            sizes,
            1
        )

    );


    const material =
        new THREE.ShaderMaterial({

        transparent:
            true,

function createStarFormation() {

    const count =
        SETTINGS.starFormation;


    const positions =
        new Float32Array(
            count * 3
        );


    const colors =
        new Float32Array(
            count * 3
        );


    const sizes =
        new Float32Array(
            count
        );


    const color =
        new THREE.Color();


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const radius =
            THREE.MathUtils.randFloat(
                12,
                56
            );


        const arm =
            ARMS[
                Math.floor(
                    Math.random() *
                    ARMS.length
                )
            ];


        const center =
            armAngle(
                radius,
                arm
            );


        /*
            Star formation is concentrated
            around the spiral density waves.
        */

        const angle =
            center +
            THREE.MathUtils.randFloatSpread(
                0.075 +
                Math.random() *
                0.17
            );


        const radial =
            radius +
            THREE.MathUtils.randFloatSpread(
                2.4
            );


        positions[i * 3] =
            Math.cos(
                angle
            ) *
            radial;


        positions[i * 3 + 1] =
            THREE.MathUtils.randFloatSpread(
                1.6
            );


        positions[i * 3 + 2] =
            Math.sin(
                angle
            ) *
            radial;


        const r =
            Math.random();


        if (
            r <
            0.40
        ) {

            color.copy(
                COLOR.pink
            );

        }
        else if (
            r <
            0.68
        ) {

            color.copy(
                COLOR.purple
            );

        }
        else if (
            r <
            0.86
        ) {

            color.copy(
                COLOR.cyan
            );

        }
        else {

            color.copy(
                COLOR.red
            );

        }


        color.multiplyScalar(
            0.55 +
            Math.random() *
            0.7
        );


        colors[i * 3] =
            color.r;

        colors[i * 3 + 1] =
            color.g;

        colors[i * 3 + 2] =
            color.b;


        sizes[i] =
            0.8 +
            Math.pow(
                Math.random(),
                4
            ) *
            5.5;

    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );


    geometry.setAttribute(
        "aSize",
        new THREE.BufferAttribute(
            sizes,
            1
        )
    );


    const material =
        new THREE.ShaderMaterial({

        transparent:
            true,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending,

        vertexColors:
            true,


        vertexShader: `

            attribute float aSize;

            varying vec3 vColor;


            void main() {

                vec4 mv =
                    modelViewMatrix *
                    vec4(
                        position,
                        1.0
                    );


                gl_PointSize =
                    aSize *
                    (
                        125.0 /
                        -mv.z
                    );


                gl_PointSize =
                    clamp(
                        gl_PointSize,
                        0.4,
                        16.0
                    );


                gl_Position =
                    projectionMatrix *
                    mv;


                vColor =
                    color;

            }

        `,


        fragmentShader: `

            varying vec3 vColor;


            void main() {

                vec2 uv =
                    gl_PointCoord -
                    0.5;


                float d =
                    length(
                        uv
                    );


                float glow =
                    1.0 -
                    smoothstep(
                        0.0,
                        0.5,
                        d
                    );


                float core =
                    1.0 -
                    smoothstep(
                        0.0,
                        0.13,
                        d
                    );


                float alpha =
                    glow *
                    (
                        0.42 +
                        core *
                        1.6
                    );


                if (
                    alpha <
                    0.01
                )
                    discard;


                gl_FragColor =
                    vec4(
                        vColor,
                        alpha *
                        0.72
                    );

            }

        `

    });


    const regions =
        new THREE.Points(
            geometry,
            material
        );


    galaxy.add(
        regions
    );

}

// ============================================================
// CENTRAL GLOW SPRITE
// ============================================================

function createGlow(
    color,
    size,
    opacity
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;

    canvas.height =
        256;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const gradient =
        ctx.createRadialGradient(

            128,
            128,
            0,

            128,
            128,
            128

        );


    gradient.addColorStop(
        0,
        color
    );


    gradient.addColorStop(
        0.10,
        color
    );


    gradient.addColorStop(
        0.30,
        "rgba(255,190,90,.30)"
    );


    gradient.addColorStop(
        0.65,
        "rgba(255,100,40,.07)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        256,
        256
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    const material =
        new THREE.SpriteMaterial({

            map:
                texture,

            transparent:
                true,

            opacity:

                opacity,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.scale.set(
        size,
        size,
        1
    );


    galaxy.add(
        sprite
    );

}

// ============================================================
// ANIMATION
// ============================================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /*
        Extremely slow rotation.

        Keeps it astronomical rather
        than game-like.
    */

    galaxy.rotation.y =
        time *
        0.0035;


    galaxyMaterial
        .uniforms
        .uTime
        .value =
        time;


    controls.update();


    composer.render();

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Realistic Neptune - Three.js</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#b9d7ff;
    font-family:Arial,sans-serif;
    font-size:17px;
    z-index:10;
}
</style>
</head>

<body>

<div id="loading">
    Loading Neptune...
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

// =====================================================
// SCENE
// =====================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


// =====================================================
// CAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        40,
        window.innerWidth /
        window.innerHeight,
        0.01,
        1000
    );

camera.position.set(
    0,
    0.25,
    4.2
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

renderer.physicallyCorrectLights =
    true;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.0;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// CONTROLS
// =====================================================

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor =
    0.035;

controls.enablePan = false;

controls.minDistance = 2.0;

controls.maxDistance = 9;

controls.target.set(
    0,
    0,
    0
);


// =====================================================
// TEXTURE
// =====================================================

const loader =
    new THREE.TextureLoader();

const neptuneTexture =
    loader.load(

        "https://raw.githubusercontent.com/Shriisoot/Planets-texture/refs/heads/main/2k_neptune.jpg",

        function(texture){

            texture.encoding =
                THREE.sRGBEncoding;

            texture.anisotropy =
                renderer.capabilities
                .getMaxAnisotropy();

            texture.generateMipmaps =
                true;

            texture.minFilter =
                THREE.LinearMipmapLinearFilter;

            texture.magFilter =
                THREE.LinearFilter;

            texture.wrapS =
                THREE.RepeatWrapping;

            texture.wrapT =
                THREE.ClampToEdgeWrapping;

            texture.needsUpdate =
                true;

            document.getElementById(
                "loading"
            ).style.display =
                "none";
        },

        undefined,

        function(error){

            console.error(
                "Neptune texture error:",
                error
            );

            document.getElementById(
                "loading"
            ).innerHTML =
                "Texture failed to load";
        }
    );


// =====================================================
// NEPTUNE GEOMETRY
// =====================================================

const neptuneGeometry =
    new THREE.SphereGeometry(
        1,
        256,
        256
    );


// =====================================================
// NEPTUNE MATERIAL
// =====================================================

const neptuneMaterial =
    new THREE.MeshPhongMaterial({

        map:
            neptuneTexture,

        color:
            0xffffff,

        shininess:
            2,

        specular:
            new THREE.Color(
                0x142c4d
            )
    });


// =====================================================
// NEPTUNE
// =====================================================

const neptune =
    new THREE.Mesh(
        neptuneGeometry,
        neptuneMaterial
    );


// =====================================================
// REAL SHAPE
// =====================================================

neptune.scale.set(
    1,
    0.983,
    1
);


// =====================================================
// AXIAL TILT
// =====================================================

neptune.rotation.z =
    THREE.MathUtils.degToRad(
        28.32
    );

scene.add(
    neptune
);


// =====================================================
// ATMOSPHERE
// =====================================================

const atmosphereGeometry =
    new THREE.SphereGeometry(
        1.025,
        192,
        192
    );


const atmosphereMaterial =
    new THREE.ShaderMaterial({

        transparent:true,

        side:
            THREE.BackSide,

        blending:
            THREE.AdditiveBlending,

        depthWrite:false,

        uniforms:{

            glowColor:{
                value:
                    new THREE.Color(
                        0x164b9a
                    )
            }

        },

        vertexShader:`

            varying vec3 vNormal;

            varying vec3 vWorldPosition;

            void main(){

                vNormal =
                    normalize(
                        normalMatrix *
                        normal
                    );

                vec4 worldPosition =
                    modelMatrix *
                    vec4(
                        position,
                        1.0
                    );

                vWorldPosition =
                    worldPosition.xyz;

                gl_Position =
                    projectionMatrix *
                    viewMatrix *
                    worldPosition;
            }

        `,

        fragmentShader:`

            uniform vec3 glowColor;

            varying vec3 vNormal;

            varying vec3 vWorldPosition;

            void main(){

                vec3 viewDirection =
                    normalize(
                        cameraPosition -
                        vWorldPosition
                    );

                float rim =
                    1.0 -
                    max(
                        dot(
                            vNormal,
                            viewDirection
                        ),
                        0.0
                    );

                rim =
                    pow(
                        rim,
                        4.0
                    );

                gl_FragColor =
                    vec4(
                        glowColor,
                        rim * 0.17
                    );
            }

        `
    });


const atmosphere =
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    );

atmosphere.scale.set(
    1,
    0.983,
    1
);

atmosphere.rotation.z =
    THREE.MathUtils.degToRad(
        28.32
    );

scene.add(
    atmosphere
);


// =====================================================
// NEPTUNE RINGS
// =====================================================

const rings =
    new THREE.Group();


function createRing(
    inner,
    outer,
    opacity
){

    const geometry =
        new THREE.RingGeometry(
            inner,
            outer,
            512,
            32
        );

    const material =
        new THREE.MeshBasicMaterial({

            color:
                0x697582,

            transparent:true,

            opacity:
                opacity,

            side:
                THREE.DoubleSide,

            depthWrite:false
        });

    const ring =
        new THREE.Mesh(
            geometry,
            material
        );

    ring.rotation.x =
        Math.PI / 2;

    return ring;
}


// Neptune's faint rings

rings.add(
    createRing(
        1.28,
        1.295,
        0.18
    )
);

rings.add(
    createRing(
        1.32,
        1.337,
        0.12
    )
);

rings.add(
    createRing(
        1.37,
        1.385,
        0.09
    )
);

rings.add(
    createRing(
        1.42,
        1.435,
        0.065
    )
);


// =====================================================
// RING PARTICLES
// =====================================================

const particleCount =
    7000;

const positions =
    new Float32Array(
        particleCount * 3
    );


for(
    let i=0;
    i<particleCount;
    i++
){

    const angle =
        Math.random() *
        Math.PI *
        2;

    const radius =
        1.27 +
        Math.random() *
        0.17;

    positions[i*3] =
        Math.cos(angle) *
        radius;

    positions[i*3+1] =
        (Math.random()-0.5) *
        0.003;

    positions[i*3+2] =
        Math.sin(angle) *
        radius;
}


const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({

        color:
            0x8995a5,

        size:
            0.0028,

        transparent:true,

        opacity:
            0.25,

        depthWrite:false
    });


const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

particles.rotation.x =
    Math.PI / 2;

rings.add(
    particles
);


// =====================================================
// RING TILT
// =====================================================

rings.rotation.z =
    THREE.MathUtils.degToRad(
        28.32
    );

scene.add(
    rings
);


// =====================================================
// SUN
// =====================================================

const sun =
    new THREE.DirectionalLight(
        0xdce9ff,
        3.8
    );

sun.position.set(
    -6,
    3,
    5
);

scene.add(
    sun
);


// =====================================================
// LOW BLUE FILL
// =====================================================

const fill =
    new THREE.PointLight(
        0x31558f,
        0.45,
        20
    );

fill.position.set(
    4,
    1,
    4
);

scene.add(
    fill
);


// =====================================================
// LOW AMBIENT
// =====================================================

const ambient =
    new THREE.AmbientLight(
        0x243b63,
        0.25
    );

scene.add(
    ambient
);


// =====================================================
// STARS
// =====================================================

const starCount =
    9000;

const starPositions =
    new Float32Array(
        starCount * 3
    );


for(
    let i=0;
    i<starCount;
    i++
){

    const radius =
        35 +
        Math.random()*160;

    const theta =
        Math.random()*Math.PI*2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    starPositions[i*3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    starPositions[i*3+1] =
        radius *
        Math.cos(phi);

    starPositions[i*3+2] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);
}


const starGeometry =
    new THREE.BufferGeometry();

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({

        color:
            0xffffff,

        size:
            0.03,

        transparent:true,

        opacity:
            0.82,

        depthWrite:false
    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(
    stars
);


// =====================================================
// ANIMATION
// =====================================================

function animate(){

    requestAnimationFrame(
        animate
    );

    // slow rotation
    neptune.rotation.y +=
        0.00022;

    // atmosphere follows planet
    atmosphere.rotation.y =
        neptune.rotation.y;

    // very slow rings
    rings.rotation.y +=
        0.000025;

    // stars
    stars.rotation.y +=
        0.000003;

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
